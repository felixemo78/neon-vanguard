    lance: [[0.1, 0.55, 0.07], [-0.6, 0.20, 0.06]],
    wing: [[-0.2, 0.45, 0.065], [-0.45, 0.80, 0.07]]
  };

  // one distinct airframe per enemy archetype (nose points +x)
  function enemyOutline(c, type, r, hull) {
    if (type === 'tank') {
      hullPath(c, [
        [0.82, 0], [0.64, -0.40], [0.32, -0.52], [0.46, -0.96],
        [0.02, -0.88], [-0.44, -0.72], [-0.78, -0.30], [-0.92, 0]
      ], r);
    } else if (type === 'shooter') {
      hullPath(c, [
        [0.96, 0], [0.52, -0.26], [0.38, -0.54], [0.54, -0.74],
        [0.18, -0.82], [-0.10, -0.56], [-0.44, -0.64], [-0.56, -0.30],
        [-0.88, -0.22], [-0.94, 0]
      ], r);
    } else if (type === 'dodger') {
      hullPath(c, [
        [1.30, 0], [0.22, -0.40], [-0.22, -0.78], [-0.36, -0.70],
        [-0.10, -0.24], [-0.70, 0]
      ], r);
    } else if (type === 'bomber') {
      hullPath(c, [
        [0.86, 0], [0.30, -0.34], [0.04, -0.56], [-0.22, -1.04],
        [-0.64, -0.92], [-0.48, -0.40], [-0.72, 0]
      ], r);
    } else if (type === 'sniper') {
      hullPath(c, [
        [1.55, 0], [0.30, -0.16], [-0.06, -0.52], [-0.42, -0.62],
        [-0.36, -0.28], [-0.72, -0.22], [-0.86, 0]
      ], r);
    } else if (type === 'orbiter') {
      hullPath(c, [
        [0.74, 0], [0.36, -0.62], [-0.36, -0.62], [-0.74, 0]
      ], r);
    } else if (type === 'splitter') {
      // twin catamaran hulls joined by a rear bridge
      c.beginPath();
      c.moveTo(0.95 * r, -0.10 * r);
      c.lineTo(0.32 * r, -0.64 * r);
      c.lineTo(-0.62 * r, -0.56 * r);
      c.lineTo(-0.50 * r, -0.14 * r);
      c.closePath();
      c.moveTo(0.95 * r, 0.10 * r);
      c.lineTo(0.32 * r, 0.64 * r);
      c.lineTo(-0.62 * r, 0.56 * r);
      c.lineTo(-0.50 * r, 0.14 * r);
      c.closePath();
      c.moveTo(0.20 * r, -0.14 * r);
      c.lineTo(-0.56 * r, -0.20 * r);
      c.lineTo(-0.56 * r, 0.20 * r);
      c.lineTo(0.20 * r, 0.14 * r);
      c.closePath();
    } else if (type === 'boss') {
      // unknown or missing hull falls back to the carrier
      hullPath(c, BOSS_HULLS[hull] || BOSS_HULLS.carrier, r);
    } else {
      // grunt: arrowhead dart
      hullPath(c, [
        [1.15, 0], [0.55, -0.30], [0.20, -0.34], [-0.10, -0.92],
        [-0.44, -0.86], [-0.34, -0.30], [-0.72, -0.30], [-0.90, 0]
      ], r);
    }
  }

  // one hull facing +x at the origin; shared by enemies, bosses and the title swarm
  // sprite cache: each craft look is painted once offscreen and blitted after;
  // live vector drawing cost ~0.2 ms per craft, so a 90-enemy crowd fell to ~33 fps
  var craftSprites = {};

  function craftSprite(type, r, color, o) {
    var key = type + '|' + (o.hull || '') + '|' + (o.livery || 0) + '|' + color + '|' + r;
    var s = craftSprites[key];
    if (s) return s;
    var half = Math.ceil(r * 1.7 + 10); // covers the longest nose, orbiter ring and glow stroke
    s = document.createElement('canvas');
    s.width = s.height = Math.ceil(half * 2 * DPR);
    s.half = half;
    var main = ctx;
    ctx = s.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, half * DPR, half * DPR);
    drawCraftLive(type, r, color, { livery: o.livery, hull: o.hull }, false);
    ctx = main;
    craftSprites[key] = s;
    return s;
  }

  function drawCraft(type, r, color, o, flash) {
    // hit flash and the bomber fuse animate, so they stay live
    if (flash || o.fuse !== undefined) { drawCraftLive(type, r, color, o, flash); return; }
    var s = craftSprite(type, r, color, o);
    ctx.save();
    ctx.scale(1, (o.wing || 1) * (1 - Math.abs(o.bank || 0) * 0.25));
    ctx.drawImage(s, -s.half, -s.half, s.half * 2, s.half * 2);
    ctx.restore();
  }

  function drawCraftLive(type, r, color, o, flash) {
    var boss = type === 'boss';
    var col = flash ? '#ffffff' : color;
    ctx.save();
    ctx.scale(1, (o.wing || 1) * (1 - Math.abs(o.bank || 0) * 0.25));
    ctx.fillStyle = metalFill(r, color, o.bank, flash);
    enemyOutline(ctx, type, r, o.hull);
    ctx.fill();

    // livery paint, clipped to the hull; skipped on hit flash to keep the white clean
    if (o.livery && !flash) {
      ctx.save();
      enemyOutline(ctx, type, r, o.hull);
      ctx.clip();
      if (o.livery === 1) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(0.55 * r - 0.07 * r, -r * 2, 0.14 * r, r * 4);
        ctx.fillRect(-0.45 * r - 0.07 * r, -r * 2, 0.14 * r, r * 4);
      } else {
        ctx.strokeStyle = withAlpha(color, 0.85);
        ctx.lineWidth = 0.12 * r;
        ctx.beginPath();
        ctx.moveTo(0, -0.3 * r); ctx.lineTo(-0.5 * r, -r);
        ctx.moveTo(0, 0.3 * r); ctx.lineTo(-0.5 * r, r);
        ctx.stroke();
      }
      ctx.restore();
    }

    // neon glow faked with a wide translucent stroke: shadowBlur halved fps with a 90-enemy crowd
    enemyOutline(ctx, type, r, o.hull);
    ctx.strokeStyle = withAlpha(col, 0.18);
    ctx.lineWidth = boss ? 14 : 8;
    ctx.stroke();
    ctx.strokeStyle = col;
    ctx.lineWidth = boss ? 3.4 : 2.1;
    ctx.stroke();

    drawCraftDetail(type, r, col, o);

    // lit top rim
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1;
    enemyOutline(ctx, type, r, o.hull);
    ctx.stroke();
    ctx.restore();
  }

  function drawEnemy(e) {
    var sc = 1;
    if (e.spawn > 0) {
      var k = 1 - e.spawn / 0.35;
      sc = 0.4 + k * 0.6;
    }
    var flash = e.flash > 0;
    var boss = e.type === 'boss';

    if (e.elite) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(e.x, e.y);
      ctx.rotate(G.time * 1.6);
      ctx.strokeStyle = 'rgba(251,191,36,' + (0.45 + 0.25 * Math.sin(G.time * 6)) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.arc(0, 0, e.r + 9, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      var ag = ctx.createRadialGradient(0, 0, e.r * 0.6, 0, 0, e.r * 2);
      ag.addColorStop(0, withAlpha(e.eliteColor, 0.18));
      ag.addColorStop(1, withAlpha(e.eliteColor, 0));
      ctx.fillStyle = ag;
      ctx.beginPath();
      ctx.arc(0, 0, e.r * 2, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    if (boss) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(e.x, e.y);
      ctx.rotate(-G.time * 0.6);
      ctx.strokeStyle = withAlpha(e.color, 0.3);
      ctx.lineWidth = 2;
      poly(ctx, 0, 0, e.r + 22, 8, 0);
      ctx.stroke();
      ctx.restore();
    }

    dropShadow(function () { enemyOutline(ctx, e.type, e.r * sc, e.hull); }, e.x, e.y, e.angle, boss ? 26 : 12);

    // top face + details
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.spawn > 0) ctx.scale(sc, sc);
    if (flash) {
      // hit squash
      var sq = (e.flash / 0.12) * 0.16;
      ctx.scale(1 + sq, 1 - sq * 0.7);
    }
    ctx.rotate(e.angle);

    drawCraft(e.type, e.r, e.color, e, flash);
    ctx.restore();

    // sniper charge telegraph
    if (e.type === 'sniper' && e.charge > 0) {
      var ck = 1 - e.charge / 0.7;
      ctx.save();
      ctx.globalAlpha = 0.3 + 0.5 * ck;
      ctx.strokeStyle = '#f0abfc';
      ctx.lineWidth = 1 + 3 * ck;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.angle) * 1000, e.y + Math.sin(e.angle) * 1000);
      ctx.stroke();
      ctx.restore();
    }

    // elite shield shell
    if (e.eshield > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.25 + 0.6 * (e.eshield / e.eshieldMax);
      ctx.strokeStyle = '#60a5fa';
      ctx.shadowColor = '#60a5fa'; ctx.shadowBlur = 12;
      ctx.lineWidth = 2.5;
      poly(ctx, e.x, e.y, e.r + 15, 6, -G.time * 0.8);
      ctx.stroke();
      ctx.restore();
    }

    // hp bar for tough enemies
    if (!e.boss && e.hp < e.maxHp && (e.elite || e.type === 'tank' || e.type === 'shooter' || e.type === 'splitter' || e.type === 'bomber')) {
      var w = e.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w, 4);
      ctx.fillStyle = e.elite ? '#fbbf24' : e.color;
      ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w * clamp(e.hp / e.maxHp, 0, 1), 4);
    }

    // elite tag
    if (e.elite && e.spawn <= 0) {
      ctx.save();
      ctx.font = 'bold 9px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = e.eliteColor;
      ctx.shadowColor = e.eliteColor; ctx.shadowBlur = 8;
      ctx.fillText('★ ' + e.elite, e.x, e.y - e.r - 20);
      ctx.restore();
    }
  }

  // small engine glow used by the craft detail pass
  function engineDot(x, y, rad, col) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(x, y, 0, x, y, rad * 2.6);
    g.addColorStop(0, 'rgba(235,255,255,0.95)');
    g.addColorStop(0.35, withAlpha(col, 0.75));
    g.addColorStop(1, withAlpha(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, rad * 2.6, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function turret(x, y, rad, col) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.stroke();
    ctx.strokeStyle = withAlpha(col, 0.9);
    ctx.lineWidth = Math.max(1, rad * 0.45);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + rad * 1.7, y); ctx.stroke();
    ctx.restore();
  }

  // per-airframe details: sensor eye, panels, guns, engines
  function drawCraftDetail(type, r, col, e) {
    var eye = r * (type === 'boss' ? 0.07 : 0.11);

    // sensor eye
    ctx.save();
    ctx.fillStyle = withAlpha(col, 0.3);
    ctx.beginPath(); ctx.arc(r * 0.34, 0, eye * 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(r * 0.34, 0, eye, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(r * 0.34 + eye * 0.25, -eye * 0.25, eye * 0.4, 0, TAU); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = Math.max(0.8, r * 0.03);

    if (type === 'grunt') {
      ctx.beginPath();
      ctx.moveTo(r * 0.10, 0); ctx.lineTo(-r * 0.62, 0);
      ctx.moveTo(-r * 0.22, -r * 0.36); ctx.lineTo(-r * 0.06, -r * 0.84);
      ctx.moveTo(-r * 0.22, r * 0.36); ctx.lineTo(-r * 0.06, r * 0.84);
      ctx.stroke();
      engineDot(-r * 0.58, -r * 0.15, r * 0.11, col);
      engineDot(-r * 0.58, r * 0.15, r * 0.11, col);
    } else if (type === 'dodger') {
      ctx.beginPath();
      ctx.moveTo(r * 0.30, 0); ctx.lineTo(-r * 0.55, 0);
      ctx.moveTo(-r * 0.02, -r * 0.32); ctx.lineTo(-r * 0.20, -r * 0.72);
      ctx.moveTo(-r * 0.02, r * 0.32); ctx.lineTo(-r * 0.20, r * 0.72);
      ctx.stroke();
      engineDot(-r * 0.50, 0, r * 0.15, col);
    } else if (type === 'shooter') {
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.lineWidth = Math.max(1.2, r * 0.09);
      ctx.beginPath();
      ctx.moveTo(r * 0.10, -r * 0.63); ctx.lineTo(r * 1.02, -r * 0.63);
      ctx.moveTo(r * 0.10, r * 0.63); ctx.lineTo(r * 1.02, r * 0.63);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = Math.max(0.8, r * 0.05);
      ctx.beginPath();
      ctx.moveTo(-r * 0.30, -r * 0.40); ctx.lineTo(-r * 0.30, r * 0.40);
      ctx.stroke();
      turret(0, 0, r * 0.22, col);
      engineDot(-r * 0.72, -r * 0.24, r * 0.11, col);
      engineDot(-r * 0.72, r * 0.24, r * 0.11, col);
    } else if (type === 'tank') {
      ctx.beginPath();
      ctx.moveTo(-r * 0.10, -r * 0.80); ctx.lineTo(-r * 0.10, r * 0.80);
      ctx.moveTo(-r * 0.42, -r * 0.66); ctx.lineTo(-r * 0.42, r * 0.66);
      ctx.stroke();
      turret(-r * 0.02, -r * 0.36, r * 0.16, col);
      turret(-r * 0.02, r * 0.36, r * 0.16, col);
      engineDot(-r * 0.72, -r * 0.18, r * 0.12, col);
      engineDot(-r * 0.72, r * 0.18, r * 0.12, col);
    } else if (type === 'bomber') {
      ctx.beginPath();
      ctx.moveTo(-r * 0.05, -r * 0.30); ctx.lineTo(-r * 0.05, r * 0.30);
      ctx.moveTo(r * 0.10, -r * 0.62); ctx.lineTo(-r * 0.42, -r * 0.86);
      ctx.moveTo(r * 0.10, r * 0.62); ctx.lineTo(-r * 0.42, r * 0.86);
      ctx.stroke();
      engineDot(-r * 0.34, -r * 0.72, r * 0.12, col);
      engineDot(-r * 0.34, r * 0.72, r * 0.12, col);
      if (e.fuse !== undefined) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(G.time * 30));
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, TAU); ctx.fill();
        ctx.restore();
      }
    } else if (type === 'sniper') {
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = Math.max(1, r * 0.07);
      ctx.beginPath();
      ctx.moveTo(r * 0.15, 0); ctx.lineTo(r * 1.45, 0);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(r * 0.18, 0, r * 0.20, 0, TAU);
      ctx.stroke();
      engineDot(-r * 0.62, 0, r * 0.13, col);
    } else if (type === 'orbiter') {
      ctx.globalAlpha = 0.45;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.55, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      for (var t = 0; t < 3; t++) {
        var ta = t * TAU / 3 + Math.PI / 6;
        engineDot(Math.cos(ta) * r * 1.2, Math.sin(ta) * r * 1.2, r * 0.10, col);
      }
      ctx.beginPath();
      ctx.moveTo(-r * 0.30, 0); ctx.lineTo(r * 0.30, 0);
      ctx.stroke();
    } else if (type === 'splitter') {
      ctx.beginPath();
      ctx.moveTo(r * 0.55, -r * 0.34); ctx.lineTo(-r * 0.50, -r * 0.32);
      ctx.moveTo(r * 0.55, r * 0.34); ctx.lineTo(-r * 0.50, r * 0.32);
      ctx.stroke();
      engineDot(-r * 0.48, -r * 0.30, r * 0.11, col);
      engineDot(-r * 0.48, r * 0.30, r * 0.11, col);
    } else if (type === 'boss') {
      // twin bridge towers
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.34, -r * 0.20); ctx.lineTo(-r * 0.14, -r * 0.20);
      ctx.lineTo(-r * 0.10, -r * 0.06); ctx.lineTo(-r * 0.38, -r * 0.06);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-r * 0.34, r * 0.20); ctx.lineTo(-r * 0.14, r * 0.20);
      ctx.lineTo(-r * 0.10, r * 0.06); ctx.lineTo(-r * 0.38, r * 0.06);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      // armor seams
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = Math.max(0.8, r * 0.012);
      ctx.beginPath();
      ctx.moveTo(r * 0.55, -r * 0.22); ctx.lineTo(r * 0.55, r * 0.22);
      ctx.moveTo(r * 0.10, -r * 0.44); ctx.lineTo(r * 0.10, r * 0.44);
      ctx.moveTo(-r * 0.55, -r * 0.52); ctx.lineTo(-r * 0.55, r * 0.52);
      ctx.stroke();

      var tl = BOSS_TURRETS[e && e.hull] || BOSS_TURRETS.carrier;
      for (var ti = 0; ti < tl.length; ti++) {
        turret(r * tl[ti][0], -r * tl[ti][1], r * tl[ti][2], col);
        turret(r * tl[ti][0], r * tl[ti][1], r * tl[ti][2], col);
      }

      // hangar glow
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var hgr = ctx.createRadialGradient(r * 0.35, 0, 0, r * 0.35, 0, r * 0.32);
      hgr.addColorStop(0, withAlpha(col, 0.55));
      hgr.addColorStop(1, withAlpha(col, 0));
      ctx.fillStyle = hgr;
      ctx.beginPath(); ctx.arc(r * 0.35, 0, r * 0.32, 0, TAU); ctx.fill();
      ctx.restore();

      // engine bank
      engineDot(-r * 0.82, -r * 0.20, r * 0.10, col);
      engineDot(-r * 0.82, 0, r * 0.12, col);
      engineDot(-r * 0.82, r * 0.20, r * 0.10, col);
    }
    ctx.restore();
  }

  function drawShards() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1.6;
    for (var i = 0; i < G.shards.length; i++) {
      var s = G.shards[i];
      var a = s.life / s.max;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.globalAlpha = a;
      ctx.strokeStyle = s.color;
      ctx.fillStyle = withAlpha(s.color, 0.25);
      ctx.beginPath();
      ctx.moveTo(s.size, 0); ctx.lineTo(-s.size * 0.6, -s.size * 0.5); ctx.lineTo(-s.size * 0.4, s.size * 0.6);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // edge arrows for hostiles outside the viewport
  function drawOffscreen() {
    var m = 22;
    ctx.save();
    for (var i = 0; i < G.enemies.length; i++) {
      var e = G.enemies[i];
      if (e.x > -e.r && e.x < W + e.r && e.y > -e.r && e.y < H + e.r) continue;
      var x = clamp(e.x, m, W - m), y = clamp(e.y, m, H - m);
      var a = Math.atan2(e.y - y, e.x - x);
      var col = e.boss || e.elite ? '#fbbf24' : e.color;
      var s = e.boss ? 12 : (e.elite ? 9 : 7);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a);
      ctx.globalAlpha = 0.55 + 0.35 * Math.sin(G.time * 10 + i);
      ctx.fillStyle = col;
      ctx.shadowColor = col; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, -s * 0.8); ctx.lineTo(-s * 0.3, 0); ctx.lineTo(-s * 0.7, s * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // radial light rays behind the ship on level-up
  function drawLevelFx() {
    var p = G.player;
    if (G.levelFx <= 0 || !p) return;
    var k = G.levelFx / 1.1;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(p.x, p.y);
    ctx.rotate(G.time * 0.9);
    var R = 60 + (1 - k) * 220;
    for (var i = 0; i < 12; i++) {
      ctx.rotate(TAU / 12);
      var g = ctx.createLinearGradient(0, 0, R, 0);
      g.addColorStop(0, 'rgba(253,230,138,' + (0.5 * k) + ')');
      g.addColorStop(1, 'rgba(253,230,138,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(R, -R * 0.07); ctx.lineTo(R, R * 0.07);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawTouchControls() {
    var p = G.player;
    if (!p) return;
    var L = touchLayout(W, H);
    function stick(base, active, cx, cy, kx, ky, col) {
      ctx.save();
      ctx.globalAlpha = active ? 0.9 : 0.4;
      ctx.strokeStyle = withAlpha(col, 0.7); ctx.lineWidth = 2;
      ctx.fillStyle = 'rgba(6,11,20,0.35)';
      ctx.beginPath(); ctx.arc(cx, cy, base.r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = withAlpha(col, 0.55);
      ctx.beginPath(); ctx.arc(kx, ky, base.r * 0.42, 0, TAU); ctx.fill();
      ctx.restore();
    }
    // floating sticks sit where the thumb landed; idle ones show their home spot
    var mv = touch.moveId !== null;
    var mcx = mv ? touch.ox : L.move.x, mcy = mv ? touch.oy : L.move.y;
    stick(L.move, mv, mcx, mcy, mcx + touch.mvx * L.move.r * 0.6, mcy + touch.mvy * L.move.r * 0.6, PLAYER_LOOK.engine);
    var am = touch.aimId !== null;
    var acx = am ? touch.ax : L.aim.x, acy = am ? touch.ay : L.aim.y;
    stick(L.aim, am, acx, acy, acx + touch.avx * L.aim.r * 0.6, acy + touch.avy * L.aim.r * 0.6, '#ff5a7a');

    var unlocked = p.unlocked.filter(function (u) { return u; }).length;
    var ready = { dash: p.dashCharges > 0, mine: p.mines > 0, od: p.odReady || p.odActive > 0, weapon: unlocked > 1, pause: true };
    var col = { dash: '#7dfcff', mine: '#fbbf24', od: '#7dfcff', weapon: WEAPONS[p.weapon].color, pause: '#e6faff' };
    L.buttons.forEach(function (b) {
      var pressed = false;
      for (var k in touch.buttons) if (touch.buttons[k] === b.id) pressed = true;
      ctx.save();
      ctx.globalAlpha = ready[b.id] ? (pressed ? 1 : 0.85) : 0.35;
      ctx.fillStyle = pressed ? withAlpha(col[b.id], 0.3) : 'rgba(6,11,20,0.6)';
      ctx.strokeStyle = col[b.id]; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.translate(b.x, b.y);
      if (b.id === 'pause') {
        ctx.fillStyle = col.pause;
        ctx.fillRect(-7, -9, 5, 18); ctx.fillRect(2, -9, 5, 18);
      } else if (b.id === 'weapon') {
        for (var w = 0; w < WEAPONS.length; w++) {
          ctx.fillStyle = p.unlocked[w] ? (w === p.weapon ? WEAPONS[w].color : 'rgba(230,247,255,0.4)') : 'rgba(230,247,255,0.1)';
          ctx.fillRect(-11 + w * 6, -8, 4, 16);
        }
      } else {
        ctx.scale(1.4, 1.4);
        drawSkillIcon(b.id, col[b.id], G.time);
      }
      ctx.restore();
    });
  }

  function drawCrosshair() {
    var p = G.player;
    if (!mouse.active || touch.aimId !== null || !p) return;
    var over = false;
    for (var i = 0; i < G.enemies.length; i++) {
      var e = G.enemies[i];
      if (dist(mouse.x, mouse.y, e.x, e.y) < e.r + 6) { over = true; break; }
    }
    var col = over ? '#ff5a7a' : '#7dfcff';
    var gap = 6 + p.recoil * 6 + (mouse.down ? 2 : 0);
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.strokeStyle = col;
    ctx.shadowColor = col; ctx.shadowBlur = 8;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var k = 0; k < 4; k++) {
      var a = k * Math.PI / 2 + (over ? Math.PI / 4 : 0);
      ctx.moveTo(Math.cos(a) * gap, Math.sin(a) * gap);
      ctx.lineTo(Math.cos(a) * (gap + 7), Math.sin(a) * (gap + 7));
    }
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.fillRect(-1, -1, 2, 2);
    if (over) {
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, gap + 11, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBullets() {
    var i;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < G.bullets.length; i++) {
      var b = G.bullets[i];
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(ang);
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.ellipse(0, 0, b.len, b.r, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    for (i = 0; i < G.ebullets.length; i++) {
      var e = G.ebullets[i];
      ctx.fillStyle = e.color;
      ctx.shadowColor = e.color; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    var i;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < G.parts.length; i++) {
      var p = G.parts[i];
      var a = p.life / p.max;
      ctx.globalAlpha = a;
      if (p.streak) {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
        ctx.stroke();
        continue;
      }
      ctx.fillStyle = p.color;
      var s = p.size * (0.4 + a * 0.8);
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    for (i = 0; i < G.rings.length; i++) {
      var r = G.rings[i];
      var t = 1 - r.life / r.max;
      var rad = r.r * (0.15 + t * 0.85);
      if (r.shock) {
        // ease-out expansion, glow band trailing a hot white edge
        var te = 1 - Math.pow(1 - t, 3);
        rad = r.r * (0.08 + te * 0.92);
        ctx.globalAlpha = (1 - t) * 0.22;
        ctx.strokeStyle = r.color;
        ctx.lineWidth = r.w * 4 * (1 - t * 0.5);
        ctx.beginPath();
        ctx.arc(r.x, r.y, Math.max(1, rad - r.w * 1.5), 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = (1 - t) * 0.9;
        ctx.lineWidth = r.w * (1 - t * 0.6) + 0.5;
        ctx.beginPath();
        ctx.arc(r.x, r.y, rad, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = (1 - t) * 0.8;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(r.x, r.y, rad + r.w * 0.5, 0, TAU);
        ctx.stroke();
        continue;
      }
      ctx.globalAlpha = (1 - t) * 0.9;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.w * (1 - t * 0.6) + 0.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, rad, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawDrops() {
    for (var i = 0; i < G.drops.length; i++) {
      var d = G.drops[i];
      var col = d.kind === 'heal' ? '#34d399'
        : d.kind === 'shield' ? '#60a5fa'
        : d.kind === 'spread' ? '#fca5a5'
        : d.kind === 'rapid' ? '#ffd166' : '#f87171';
      var pulse = 1 + Math.sin(d.bob * 2) * 0.12;
      var blink = d.life < 3.5 ? (Math.sin(G.time * 20) > 0 ? 1 : 0.25) : 1;
      ctx.save();
      ctx.globalAlpha = blink;
      ctx.translate(d.x, d.y);
      ctx.rotate(d.bob * 0.5);
      ctx.shadowColor = col; ctx.shadowBlur = 18;
      ctx.strokeStyle = col; ctx.lineWidth = 2.5;
      ctx.fillStyle = 'rgba(6,8,16,0.7)';
      poly(ctx, 0, 0, d.r * pulse, 6, 0);
      ctx.fill(); ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.fillStyle = col;
      ctx.font = 'bold 13px ui-monospace, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var ch = d.kind === 'heal' ? '+' : d.kind === 'shield' ? 'S' : d.kind === 'spread' ? 'W' : d.kind === 'rapid' ? 'R' : 'N';
      ctx.fillText(ch, 0, 0.5);
      ctx.restore();
    }
  }

  function drawTexts() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < G.texts.length; i++) {
      var t = G.texts[i];
      var a = clamp(t.life / t.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.font = 'bold ' + Math.round(t.size * (1 + (t.pop || 0) * 0.6)) + 'px ui-monospace, monospace';
      ctx.fillStyle = t.color;
      ctx.shadowColor = t.color; ctx.shadowBlur = 12;
      ctx.fillText(t.t, t.x, t.y);
    }
    ctx.restore();
  }

  function drawHud() {
    var p = G.player;
    if (!p) return;
    var compact = W < 1000 || H < 640;
    ctx.save();
    ctx.textBaseline = 'middle';

    // ================= xp bar =================
    var xpct = clamp(p.xp / p.xpNext, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, 0, W, 5);
    ctx.save();
    var xg = ctx.createLinearGradient(0, 0, W, 0);
    xg.addColorStop(0, '#16a34a');
    xg.addColorStop(0.6, '#4ade80');
    xg.addColorStop(1, '#fde68a');
    ctx.fillStyle = xg;
    ctx.shadowColor = '#4ade80';
    ctx.shadowBlur = 10 + (G.levelFx > 0 ? 14 : 0);
    ctx.fillRect(0, 0, W * xpct, 5);
    ctx.restore();
    if (xpct > 0.01) {
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillRect(W * xpct - 2, 0, 2, 5);
    }

    // ================= status panel =================
    var sx = 18, sy = 18, sw = compact ? 244 : 288, sh = 92;
    panel(sx, sy, sw, sh, 'rgba(125,252,255,0.55)');

    hudText('HULL', sx + 14, sy + 15, 9, 'rgba(125,252,255,0.8)');
    hudText('LV ' + String(p.level).padStart(2, '0') + '  ·  XP ' + Math.floor(p.xp) + '/' + p.xpNext,
      sx + sw - 14, sy + 15, 9, G.levelFx > 0 ? '#fde68a' : 'rgba(74,222,128,0.75)', 'right');

    var hx = sx + 14, hy = sy + 26, hw = sw - 28, hh = 13;
    var hpct = clamp(p.hp / p.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    rr(ctx, hx, hy, hw, hh, 4); ctx.fill();

    if (p.hpGhost === undefined || p.hpGhost < hpct) p.hpGhost = hpct;
    p.hpGhost = Math.max(hpct, p.hpGhost - 0.008);
    if (p.hpGhost > hpct) {
      ctx.fillStyle = 'rgba(248,113,113,0.4)';
      rr(ctx, hx, hy, Math.max(0, hw * p.hpGhost), hh, 4); ctx.fill();
    }

    var hgrad = ctx.createLinearGradient(hx, 0, hx + hw, 0);
    if (hpct > 0.5) { hgrad.addColorStop(0, '#0e9f6e'); hgrad.addColorStop(1, '#6ee7b7'); }
    else if (hpct > 0.25) { hgrad.addColorStop(0, '#d97706'); hgrad.addColorStop(1, '#fde68a'); }
    else { hgrad.addColorStop(0, '#b91c1c'); hgrad.addColorStop(1, '#fca5a5'); }
    ctx.save();
    ctx.shadowColor = hpct > 0.25 ? '#10b981' : '#dc2626';
    ctx.shadowBlur = 12;
    ctx.fillStyle = hgrad;
    if (hpct > 0) { rr(ctx, hx, hy, Math.max(4, hw * hpct), hh, 4); ctx.fill(); }
    ctx.restore();

    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var si = 1; si < 10; si++) {
      var sxp = hx + hw * si / 10;
      ctx.moveTo(sxp, hy); ctx.lineTo(sxp, hy + hh);
    }
    ctx.stroke();
    hudText(Math.ceil(p.hp) + ' / ' + p.maxHp, hx + hw, hy + hh + 11, 9, 'rgba(230,247,255,0.55)', 'right');

    // overdrive mini-meter
    var oy2 = sy + 63, oh2 = 8;
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    rr(ctx, hx, oy2, hw, oh2, 3); ctx.fill();
    var opct = p.odReady ? 1 : p.odCharge / 100;
    ctx.save();
    ctx.shadowColor = '#7dfcff';
    ctx.shadowBlur = p.odReady ? 12 : 4;
    ctx.fillStyle = p.odActive > 0 ? '#ffffff' : (p.odReady ? '#7dfcff' : 'rgba(125,252,255,0.55)');
    if (opct > 0) { rr(ctx, hx, oy2, Math.max(3, hw * opct), oh2, 3); ctx.fill(); }
    ctx.restore();
    hudText(
      p.odActive > 0 ? 'OVERDRIVE  ACTIVE  ' + p.odActive.toFixed(1) + 's'
        : p.odReady ? 'OVERDRIVE  READY  [ Q ]'
          : 'OVERDRIVE  ' + Math.round(opct * 100) + '%',
      sx + 14, sy + 82, 8,
      p.odReady || p.odActive > 0 ? '#7dfcff' : 'rgba(230,247,255,0.35)'
    );

    // ================= status chips =================
    var chx = sx, chy = sy + sh + 8;
    function chip(str, col, frac) {
      ctx.save();
      ctx.font = 'bold 9px ui-monospace, monospace';
      var cwd = ctx.measureText(str).width + 16;
      ctx.fillStyle = 'rgba(6,11,20,0.72)';
      rr(ctx, chx, chy, cwd, 18, 4); ctx.fill();
      ctx.strokeStyle = withAlpha(col, 0.5);
      ctx.lineWidth = 1;
      rr(ctx, chx, chy, cwd, 18, 4); ctx.stroke();
      ctx.fillStyle = col;
      ctx.textAlign = 'left';
      ctx.fillText(str, chx + 8, chy + 9.5);
      if (frac !== undefined) {
        ctx.globalAlpha = 0.75;
        ctx.fillRect(chx + 1.5, chy + 16, (cwd - 3) * clamp(frac, 0, 1), 1.5);
      }
      ctx.restore();
      chx += cwd + 6;
    }
    if (p.rapid > 0) chip('RAPID ' + p.rapid.toFixed(0) + 's', '#ffd166', p.rapid / 11);
    if (p.spread > 0) chip('SPREAD ' + p.spread.toFixed(0) + 's', '#fca5a5', p.spread / 13);
    if (p.shield > 0) chip('SHIELD ' + p.shield.toFixed(0) + 's', '#60a5fa', p.shield / 9);
    if (G.streak >= 5) chip('STREAK ' + G.streak, '#ffd166', clamp(G.streakT / 2.6, 0, 1));

    // ================= weapon rack =================
    // on mobile the WEAPON button's pips show this, and the rack would sit under it
    var rackY = sy + sh + 34;
    for (var wi = 0; wi < WEAPONS.length && !G.mobile; wi++) {
      drawWeaponCard(sx, rackY, compact ? 150 : 176, 33, wi);
      rackY += 38;
    }

    // ================= wave strip =================
    var wsw = 188, wsh = 46, wsx = W / 2 - wsw / 2, wsy = 16;
    // too narrow to sit between the status panel and score: desktop drops it above the overdrive bar,
    // mobile (bottom belongs to the sticks) tucks it under the pause button
    if (wsx < sx + sw + 10) {
      if (G.mobile) { wsx = W - wsw - 16; wsy = 190; }
      else wsy = H - 100;
    }
    var wcx = wsx + wsw / 2;
    panel(wsx, wsy, wsw, wsh, 'rgba(125,252,255,0.45)');
    hudText('WAVE', wcx - 30, wsy + 15, 8, 'rgba(125,252,255,0.6)', 'center');
    hudText(String(G.wave).padStart(2, '0'), wcx + 14, wsy + 15, 17, '#e6faff', 'center');
    var remaining = G.enemies.length + G.spawnQueue.length;
    hudText(remaining > 0 ? remaining + ' HOSTILES' : 'SECTOR CLEAR', wcx, wsy + 34, 8,
      remaining > 0 ? 'rgba(230,247,255,0.5)' : '#6ee7b7', 'center');

    // ================= score =================
    hudText('SCORE', W - 20, 22, 8, 'rgba(125,252,255,0.55)', 'right');
    ctx.save();
    ctx.font = 'bold 28px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = G.scorePop > 0.3 ? '#ffffff' : '#e6f7ff';
    ctx.shadowColor = '#22d3ee';
    ctx.shadowBlur = 14 + G.scorePop * 14;
    var spk = 1 + G.scorePop * 0.14;
    ctx.translate(W - 20, 46);
    ctx.scale(spk, spk);
    ctx.fillText(String(Math.floor(G.scoreShown)).padStart(6, '0'), 0, 0);
    ctx.restore();
    hudText('BEST ' + String(Math.max(G.best, G.score)).padStart(6, '0'), W - 20, 66, 9, 'rgba(230,247,255,0.4)', 'right');
    if (G.scoreMul > 1) hudText((G.daily ? 'DAILY ' : 'MUTATORS ') + 'x' + G.scoreMul.toFixed(2), W - 20, 120, 8, '#f0abfc', 'right');
    if (G.combo > 1.05) {
      ctx.save();
      ctx.font = 'bold 20px ui-monospace, monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffd166';
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 12;
      ctx.fillText('x' + G.combo.toFixed(1), W - 20, 92);
      ctx.restore();
      ctx.fillStyle = 'rgba(255,209,102,0.16)';
      ctx.fillRect(W - 110, 104, 90, 3);
      ctx.fillStyle = 'rgba(255,209,102,0.8)';
      ctx.fillRect(W - 110, 104, 90 * clamp(G.comboT / 2.6, 0, 1), 3);
    }

    // on mobile the touch buttons show dash, mine and overdrive state, and the sticks need this space
    if (!G.mobile) {
      // ================= dash =================
      var dby = H - 66, dbx = 20;
      for (var di = 0; di < p.dashMax; di++) {
        var filled = di < p.dashCharges;
        ctx.save();
        ctx.translate(dbx + di * 15, dby);
        ctx.beginPath();
        ctx.moveTo(0, -8); ctx.lineTo(7, 0); ctx.lineTo(0, 8); ctx.lineTo(-3, 0);
        ctx.closePath();
        ctx.fillStyle = filled ? '#7dfcff' : 'rgba(125,252,255,0.13)';
        if (filled) { ctx.shadowColor = '#7dfcff'; ctx.shadowBlur = 10; }
        ctx.fill();
        ctx.restore();
      }
      hudText('DASH', dbx + p.dashMax * 15 + 6, dby, 8, 'rgba(125,252,255,0.45)');

      // ================= mines =================
      var mbx = dbx + p.dashMax * 15 + 46;
      for (var mi = 0; mi < p.mineMax; mi++) {
        var have = mi < p.mines;
        ctx.save();
        ctx.translate(mbx + mi * 14, dby);
        ctx.strokeStyle = have ? '#fbbf24' : 'rgba(251,191,36,0.16)';
        ctx.lineWidth = 1.8;
        poly(ctx, 0, 0, 5.5, 6, 0);
        ctx.stroke();
        if (have) { ctx.fillStyle = 'rgba(251,191,36,0.6)'; ctx.fill(); }
        ctx.restore();
      }
      hudText('MINES', mbx + p.mineMax * 14 + 6, dby, 8, 'rgba(251,191,36,0.45)');

      // ================= overdrive bar =================
      var ow = Math.min(300, W * 0.28), ox = W / 2 - ow / 2, oy = H - 30;
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      rr(ctx, ox, oy, ow, 10, 5); ctx.fill();
      ctx.save();
      ctx.shadowColor = '#7dfcff';
      ctx.shadowBlur = p.odReady ? 20 : 7;
      ctx.fillStyle = p.odActive > 0 ? '#ffffff' : (p.odReady ? '#7dfcff' : 'rgba(125,252,255,0.5)');
      if (opct > 0) { rr(ctx, ox, oy, Math.max(4, ow * opct), 10, 5); ctx.fill(); }
      ctx.restore();
      ctx.strokeStyle = 'rgba(125,252,255,0.3)';
      ctx.lineWidth = 1;
      rr(ctx, ox, oy, ow, 10, 5); ctx.stroke();
      if (p.odReady && p.odActive <= 0) {
        ctx.save();
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(G.time * 8);
        hudText('[ Q ]  OVERDRIVE READY', W / 2, oy - 13, 9, '#7dfcff', 'center');
        ctx.restore();
      } else if (p.odActive > 0) {
        hudText('OVERDRIVE  ' + p.odActive.toFixed(1) + 's', W / 2, oy - 13, 9, '#bffcff', 'center');
      }
    }

    // ================= radar =================
    if (!compact && !G.mobile) drawRadar(W - 82, H - 84, 56);

    // ================= toast =================
    if (G.toastT > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(G.toastT, 0, 1);
      ctx.textAlign = 'center';
      ctx.font = 'bold 13px ui-monospace, monospace';
      ctx.fillStyle = '#7dfcff';
      ctx.shadowColor = '#7dfcff';
      ctx.shadowBlur = 14;
      ctx.fillText(G.toast, W / 2, 108);
      ctx.restore();
    }

    ctx.restore();
  }

  function drawWeaponCard(x, y, w, h, i) {
    var p = G.player;
    var wd = WEAPONS[i];
    var unlocked = p.unlocked[i];
    var active = p.weapon === i;

    ctx.save();
    ctx.globalAlpha = unlocked ? 1 : 0.32;

    ctx.fillStyle = active ? withAlpha(wd.color, 0.14) : 'rgba(8,12,22,0.62)';
    rr(ctx, x, y, w, h, 5);
    ctx.fill();

    if (active) {
      ctx.save();
      ctx.shadowColor = wd.color;
      ctx.shadowBlur = 13;
      ctx.strokeStyle = wd.color;
      ctx.lineWidth = 1.8;
      rr(ctx, x, y, w, h, 5);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = wd.color;
      ctx.fillRect(x + 1, y + 7, 2, h - 14);
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      rr(ctx, x, y, w, h, 5);
      ctx.stroke();
    }

    ctx.fillStyle = active ? wd.color : 'rgba(255,255,255,0.1)';
    rr(ctx, x + 6, y + 7, 19, 19, 4);
    ctx.fill();
    hudText(String(i + 1), x + 15.5, y + h / 2, 10, active ? '#04121a' : 'rgba(230,247,255,0.75)', 'center');

    hudText(unlocked ? wd.name : 'LOCKED', x + 32, y + 12, 9,
      active ? wd.color : 'rgba(230,247,255,0.72)');

    var sub;
    if (unlocked) {
      var rof = 1 / (wd.rate / Math.max(0.2, p.rateMul));
      sub = 'DMG ' + Math.round(wd.dmg * p.dmgMul) + '   ROF ' + rof.toFixed(1);
    } else {
      var unlockAt = [1, 2, 4, 6][i];
      sub = 'UNLOCK  WAVE ' + unlockAt;
    }
    hudText(sub, x + 32, y + 24, 7.5, 'rgba(230,247,255,0.36)');
    ctx.restore();
  }

  function drawRadar(cx, cy, r) {
    var p = G.player;
    if (!p) return;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.fillStyle = 'rgba(4,12,18,0.72)';
    ctx.fill();
    ctx.clip();

    ctx.strokeStyle = 'rgba(125,252,255,0.11)';
    ctx.lineWidth = 1;
    for (var ri = 1; ri <= 2; ri++) {
      ctx.beginPath();
      ctx.arc(cx, cy, r * ri / 3, 0, TAU);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
    ctx.stroke();

    var sw = G.time * 1.9;
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#7dfcff';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, sw, sw + 0.65);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    var scale = r / 820;
    function blip(bx, by, col, size) {
      var dx = (bx - p.x) * scale;
      var dy = (by - p.y) * scale;
      var dd = Math.sqrt(dx * dx + dy * dy);
      if (dd > r - 3) { dx *= (r - 3) / dd; dy *= (r - 3) / dd; }
      ctx.beginPath();
      ctx.arc(cx + dx, cy + dy, size, 0, TAU);
      ctx.fillStyle = col;
      ctx.fill();
    }

    var i;
    for (i = 0; i < G.drops.length; i++) blip(G.drops[i].x, G.drops[i].y, '#6ee7b7', 2.1);
    for (i = 0; i < G.mines.length; i++) blip(G.mines[i].x, G.mines[i].y, '#fbbf24', 2.4);
    for (i = 0; i < G.enemies.length; i++) {
      var e = G.enemies[i];
      if (e.spawn > 0) continue;
      var big = e.boss || e.type === 'tank' || e.type === 'splitter';
      blip(e.x, e.y, e.boss ? '#ffffff' : e.color, e.boss ? 5 : (big ? 2.8 : 2));
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(p.angle);
    ctx.fillStyle = 'rgba(125,252,255,0.22)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(r * 0.55, -r * 0.3);
    ctx.lineTo(r * 0.55, r * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(125,252,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = 'rgba(125,252,255,0.45)';
    ctx.font = 'bold 8px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('S C A N', cx, cy + r + 13);
    ctx.restore();
  }

  function drawBossBar() {
    var boss = null;
    for (var i = 0; i < G.enemies.length; i++) if (G.enemies[i].boss) boss = G.enemies[i];
    if (!boss) return;
    // keep the bar clear of the status panel on the left and score column on the right
    var compactHud = W < 1000 || H < 640;
    var leftEdge = 18 + (compactHud ? 244 : 288) + 14;
    var w = Math.min(560, W - 2 * leftEdge);
    if (w < 240) w = Math.min(560, W - 40);
    var x = W / 2 - w / 2, y = 84, h = 12;
    var col = boss.color || '#f43f5e';
    var pct = clamp(boss.hp / boss.maxHp, 0, 1);

    hudText('▲  ' + (boss.name || 'WARDEN') + '  //  ' + (boss.title || 'CLASS-VII'),
      W / 2, y - 12, 10, col, 'center');

    ctx.save();
    ctx.fillStyle = 'rgba(6,11,20,0.82)';
    rr(ctx, x, y, w, h, 3); ctx.fill();
    ctx.strokeStyle = withAlpha(col, 0.5);
    ctx.lineWidth = 1;
    rr(ctx, x, y, w, h, 3); ctx.stroke();

    var g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#7f1d1d');
    g.addColorStop(0.45, col);
    g.addColorStop(1, '#fecdd3');
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = 16;
    ctx.fillStyle = g;
    if (pct > 0) { rr(ctx, x + 1, y + 1, Math.max(2, (w - 2) * pct), h - 2, 2); ctx.fill(); }
    ctx.restore();

    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var k = 1; k < 4; k++) {
      var tx = x + w * k / 4;
      ctx.moveTo(tx, y + 1);
      ctx.lineTo(tx, y + h - 1);
    }
    ctx.stroke();

    hudText(Math.ceil(pct * 100) + '%', x + w, y + h + 10, 8, 'rgba(255,255,255,0.6)', 'right');
    ctx.restore();
  }

  function drawWaveBanner() {
    if (G.waveBanner <= 0) return;
    var a = clamp(G.waveBanner, 0, 1) * clamp(G.waveBanner / 0.5, 0, 1);
    var big = 44;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var isBoss = G.waveBannerText.indexOf('BOSS') >= 0;
    var col = isBoss ? '#f43f5e' : '#7dfcff';
    ctx.font = 'bold ' + big + 'px ui-monospace, monospace';
    ctx.shadowColor = col; ctx.shadowBlur = 28;
    ctx.fillStyle = col;
    ctx.fillText(G.waveBannerText, W / 2, H * 0.42);
    ctx.restore();
  }

  function wrapText(text, cx, cy, maxW, lh) {
    var words = text.split(' ');
    var line = '';
    var lines = [];
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    for (var j = 0; j < lines.length; j++) ctx.fillText(lines[j], cx, cy + j * lh);
  }

  // ---------------------------------------------------------------- skill icons
  // each upgrade icon is a tiny scene of its effect, drawn from the game's own art, so choices read true

  function iShip(x, y, s, alpha) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.globalAlpha *= alpha === undefined ? 1 : alpha;
    ctx.fillStyle = PLAYER_LOOK.hull;
    ctx.strokeStyle = PLAYER_LOOK.trim;
    ctx.lineWidth = 1.4;
    shipPath(ctx); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function iEnemy(x, y, r) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(Math.PI);
    ctx.fillStyle = '#2a0b14';
    ctx.strokeStyle = ETYPES.grunt.color;
    ctx.lineWidth = 1.3;
    enemyOutline(ctx, 'grunt', r); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function iBullet(x, y, ang, len, rad) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = PLAYER_LOOK.engine;
    ctx.beginPath(); ctx.ellipse(0, 0, len, rad, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function iSpark(x, y, r, col) {
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < 4; i++) {
      var a = i * Math.PI / 4;
      ctx.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r);
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.stroke();
    ctx.restore();
  }

  function iHeart(x, y, s, col) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, 3);
    ctx.bezierCurveTo(-6, -1, -4, -6, 0, -3);
    ctx.bezierCurveTo(4, -6, 6, -1, 0, 3);
    ctx.fill();
    ctx.restore();
  }

  function iPlus(x, y, r, col) {
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
    ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
    ctx.stroke();
    ctx.restore();
  }

  function iBolt(x, y, ang, len, col) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(len * 0.45, -2); ctx.lineTo(len * 0.55, 2); ctx.lineTo(len, 0);
    ctx.stroke();
    ctx.restore();
  }

  function iCrosshair(x, y, r, col) {
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - r - 3, y); ctx.lineTo(x - r + 3, y);
    ctx.moveTo(x + r - 3, y); ctx.lineTo(x + r + 3, y);
    ctx.moveTo(x, y - r - 3); ctx.lineTo(x, y - r + 3);
    ctx.moveTo(x, y + r - 3); ctx.lineTo(x, y + r + 3);
    ctx.stroke();
    ctx.restore();
  }

  var SKILL_ICONS = {
    spd: function (col) {
      ctx.save();
      ctx.fillStyle = withAlpha(PLAYER_LOOK.engine, 0.9);
      ctx.beginPath(); ctx.moveTo(-5, -2.5); ctx.lineTo(-14, 0); ctx.lineTo(-5, 2.5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-12, -8); ctx.lineTo(-3, -8);
      ctx.moveTo(-12, 8); ctx.lineTo(-3, 8);
      ctx.stroke();
      ctx.restore();
      iShip(3, 0, 0.55);
    },
    rate: function (col) {
      for (var i = 0; i < 3; i++) iBullet(-8 + i * 8, 0, 0, 3.5, 1.8);
      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-6, -8); ctx.lineTo(-2, -5); ctx.lineTo(2, -8);
      ctx.moveTo(-6, 8); ctx.lineTo(-2, 5); ctx.lineTo(2, 8);
      ctx.stroke();
      ctx.restore();
    },
    dmg: function (col) {
      iBullet(-4, 0, 0, 8, 4);
      iSpark(8, 0, 6, col);
    },
    hp: function (col) {
      ctx.save();
      ctx.fillStyle = withAlpha(col, 0.3);
      ctx.strokeStyle = col; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(0, -11); ctx.lineTo(9, -7); ctx.lineTo(8, 4); ctx.lineTo(0, 11); ctx.lineTo(-8, 4); ctx.lineTo(-9, -7);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      iPlus(0, 0, 4, '#ffffff');
    },
    mag: function (col) {
      iShip(-7, 0, 0.42);
      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(-4, 0, 9, -0.6, 0.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(-4, 0, 13, -0.45, 0.45); ctx.stroke();
      ctx.fillStyle = '#4ade80';
      ctx.beginPath(); ctx.moveTo(9, -5); ctx.lineTo(12, 0); ctx.lineTo(9, 5); ctx.lineTo(6, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    },
    mine: function (col) {
      ctx.save();
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2;
      poly(ctx, 0, 0, 8, 6, 0); ctx.stroke();
      ctx.fillStyle = '#fbbf24';
      poly(ctx, 0, 0, 3.6, 6, Math.PI / 6); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
      ctx.restore();
    },
    dash: function (col) {
      iShip(-9, 0, 0.5, 0.2);
      iShip(-2, 0, 0.5, 0.45);
      iShip(6, 0, 0.5);
      iSpark(-12, 0, 2, col);
    },
    pierce: function (col) {
      iEnemy(-3, 0, 5);
      iEnemy(6, 0, 5);
      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(11, 0); ctx.stroke();
      ctx.restore();
      iBullet(12, 0, 0, 3, 2);
    },
    proj: function (col) {
      ctx.save();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(-10, 0, 2.4, 0, TAU); ctx.fill();
      ctx.restore();
      [-0.45, 0, 0.45].forEach(function (a) { iBullet(-10 + Math.cos(a) * 15, Math.sin(a) * 15, a, 3.5, 1.8); });
    },
    crit: function (col) {
      iEnemy(0, 0, 6);
      iCrosshair(0, 0, 8, col);
    },
    critm: function (col) {
      iEnemy(-2, 2, 7);
      ctx.save();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-6, -1); ctx.lineTo(-2, 2); ctx.lineTo(-4, 5); ctx.lineTo(1, 8); ctx.stroke();
      ctx.restore();
      iSpark(5, -5, 7, col);
    },
    life: function (col) {
      iEnemy(-8, -6, 4);
      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = 1.4; ctx.setLineDash([2, 2]);
      ctx.beginPath(); ctx.moveTo(-5, -3); ctx.lineTo(3, 3); ctx.stroke();
      ctx.restore();
      iHeart(6, 5, 1.3, '#f43f5e');
    },
    regen: function (col) {
      iHeart(0, -1, 1.6, '#6ee7b7');
      iPlus(0, -2, 2.5, '#ffffff');
      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(-12, 9); ctx.lineTo(-4, 9); ctx.lineTo(-2, 5); ctx.lineTo(1, 12); ctx.lineTo(3, 9); ctx.lineTo(12, 9);
      ctx.stroke();
      ctx.restore();
    },
    thorn: function (col) {
      ctx.save();
      ctx.globalAlpha = 0.55; ctx.strokeStyle = '#f97316'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (var i = 0; i < 8; i++) {
        var a = i * TAU / 8;
        ctx.moveTo(Math.cos(a) * 7, Math.sin(a) * 7);
        ctx.lineTo(Math.cos(a) * 10, Math.sin(a) * 10);
      }
      ctx.stroke();
      ctx.restore();
      iShip(0, 0, 0.4);
    },
    slow: function (col) {
      iEnemy(-3, 3, 7);
      ctx.save();
      ctx.fillStyle = '#0b1220'; ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(6, -6, 6, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(6, -10); ctx.moveTo(6, -6); ctx.lineTo(9, -5); ctx.stroke();
      ctx.restore();
    },
    od: function (col) {
      ctx.save();
      ctx.fillStyle = withAlpha(col, 0.35);
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 2.8, 0, TAU); ctx.fill();
      ctx.restore();
      for (var i = 0; i < 4; i++) iBolt(Math.cos(i * TAU / 4 + 0.6) * 6, Math.sin(i * TAU / 4 + 0.6) * 6, i * TAU / 4 + 0.6, 7, col);
    },
    odb: function (col) {
      ctx.save();
      ctx.fillStyle = withAlpha(col, 0.35);
      ctx.beginPath(); ctx.arc(-5, -3, 5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(-5, -3, 2.2, 0, TAU); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.2;
      rr(ctx, -12, 6, 24, 5, 2); ctx.stroke();
      ctx.fillStyle = col;
      rr(ctx, -12, 6, 20, 5, 2); ctx.fill();
      ctx.restore();
      iBolt(1, -3, 0, 10, col);
    },
    expl: function (col) {
      iBullet(-8, 5, -0.5, 3.5, 1.8);
      ctx.save();
      ctx.fillStyle = withAlpha('#fdba74', 0.35);
      ctx.beginPath(); ctx.arc(4, -3, 7, 0, TAU); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(4, -3, 8.5, 0, TAU); ctx.stroke();
      ctx.restore();
      iSpark(4, -3, 4, '#ffffff');
    },
    richo: function (col) {
      iEnemy(-7, 7, 4);
      iEnemy(7, 7, 4);
      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = 1.4; ctx.setLineDash([3, 2]);
      ctx.beginPath(); ctx.moveTo(-13, -9); ctx.lineTo(-7, 3); ctx.lineTo(0, -7); ctx.lineTo(7, 3); ctx.stroke();
      ctx.restore();
      iBullet(-13, -9, 1.1, 2.5, 1.6);
    },
    wave: function (col) {
      ctx.save();
      ctx.fillStyle = withAlpha('#60a5fa', 0.15);
      ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, 11, -2.4, -1.2); ctx.stroke();
      ctx.restore();
      iShip(0, 0, 0.42);
    }
  };

  // returns false when the id has no icon (draws a generic hexagon instead)
  function drawSkillIcon(id, col, t) {
    var fn = SKILL_ICONS[id];
    ctx.save();
    ctx.fillStyle = withAlpha(col, 0.12);
    rr(ctx, -14, -14, 28, 28, 6); ctx.fill();
    ctx.strokeStyle = withAlpha(col, 0.6); ctx.lineWidth = 1;
    rr(ctx, -14, -14, 28, 28, 6); ctx.stroke();
    if (fn) fn(col);
    else { ctx.strokeStyle = col; ctx.lineWidth = 2; poly(ctx, 0, 0, 10, 6, t * 0.6); ctx.stroke(); }
    ctx.restore();
    return !!fn;
  }

  function drawUpgrade() {
    ctx.save();
    ctx.fillStyle = 'rgba(4,5,10,0.84)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var lvl = G.upgradeReason === 'level';
    var hk = clamp(G.upgradeT / 0.3, 0, 1);
    ctx.font = 'bold ' + Math.round(34 * (0.7 + 0.3 * hk)) + 'px ui-monospace, monospace';
    ctx.globalAlpha = hk;
    ctx.shadowColor = lvl ? '#fbbf24' : '#7dfcff'; ctx.shadowBlur = 24;
    ctx.fillStyle = lvl ? '#fde68a' : '#e6faff';
    ctx.fillText(lvl ? 'LEVEL ' + G.player.level + ' REACHED' : 'WAVE ' + G.wave + ' CLEARED', W / 2, 84);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.font = 'bold 15px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(125,252,255,' + (0.5 + 0.4 * Math.sin(G.time * 4)) + ')';
    ctx.fillText('CHOOSE AN UPGRADE   —   CLICK  OR  PRESS  1 / 2 / 3', W / 2, 126);

    var rects = cardRects();
    var mx = mouse.active ? mouse.x : -9999, my = mouse.active ? mouse.y : -9999;
    for (var i = 0; i < rects.length; i++) {
      var r = rects[i], c = r.card;
      var col = RCOLOR[c.r] || '#7dd3fc';
      var hover = mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
      var stacks = cardStacks(G.player, c.id);
      // staggered flip-in
      var ek = clamp((G.upgradeT - i * 0.09) / 0.38, 0, 1);
      var eb = 1 + 2.4 * Math.pow(ek - 1, 3) + 1.4 * Math.pow(ek - 1, 2);
      if (ek <= 0) continue;
      ctx.save();
      ctx.globalAlpha = ek;
      var fcx = r.x + r.w / 2, fcy = r.y + r.h / 2;
      ctx.translate(fcx, fcy + (1 - eb) * 70);
      ctx.scale(Math.max(0.04, Math.min(1, eb)), 1);
      ctx.translate(-fcx, -fcy);
      if (hover) {
        var ccx = r.x + r.w / 2, ccy = r.y + r.h / 2;
        ctx.translate(ccx, ccy - 7);
        ctx.scale(1.035, 1.035);
        ctx.translate(-ccx, -ccy);
      }
      ctx.fillStyle = hover ? 'rgba(22,28,44,0.97)' : 'rgba(12,16,26,0.93)';
      rr(ctx, r.x, r.y, r.w, r.h, 14); ctx.fill();
      ctx.shadowColor = col; ctx.shadowBlur = hover ? 26 : 12;
      ctx.strokeStyle = col; ctx.lineWidth = hover ? 3 : 2;
      rr(ctx, r.x, r.y, r.w, r.h, 14); ctx.stroke();
      ctx.shadowBlur = 0;

      // rare+ cards get a light sweep across the face
      if (c.r !== 'common') {
        ctx.save();
        rr(ctx, r.x, r.y, r.w, r.h, 14);
        ctx.clip();
        var sweep = wrapNum(G.time * (c.r === 'epic' ? 1.1 : 0.6) + i * 0.4, 2.2) - 0.6;
        var swx = r.x + sweep * r.w;
        var sg = ctx.createLinearGradient(swx - 40, r.y, swx + 40, r.y + r.h * 0.3);
        sg.addColorStop(0, withAlpha(col, 0));
        sg.addColorStop(0.5, withAlpha(col, c.r === 'epic' ? 0.22 : 0.1));
        sg.addColorStop(1, withAlpha(col, 0));
        ctx.fillStyle = sg;
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.restore();
      }

      ctx.textAlign = 'left';
      ctx.fillStyle = col;
      ctx.font = 'bold 10px ui-monospace, monospace';
      ctx.fillText(c.r.toUpperCase(), r.x + 16, r.y + 22);

      ctx.save();
      ctx.translate(r.x + r.w / 2, r.y + r.h * 0.36);
      ctx.scale(2.1, 2.1);
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
      drawSkillIcon(c.id, col, G.time);
      ctx.restore();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#e6faff';
      ctx.font = 'bold 16px ui-monospace, monospace';
      var parts = c.n.split(' ');
      if (parts.length > 1 && ctx.measureText(c.n).width > r.w - 26) {
        ctx.fillText(parts[0], r.x + r.w / 2, r.y + r.h * 0.56);
        ctx.fillText(parts.slice(1).join(' '), r.x + r.w / 2, r.y + r.h * 0.56 + 19);
      } else {
        ctx.fillText(c.n, r.x + r.w / 2, r.y + r.h * 0.56);
      }

      ctx.fillStyle = 'rgba(230,247,255,0.72)';
      ctx.font = '12px ui-monospace, monospace';
      wrapText(c.d, r.x + r.w / 2, r.y + r.h * 0.74, r.w - 28, 16);

      if (stacks > 0) {
        ctx.fillStyle = col;
        ctx.font = 'bold 11px ui-monospace, monospace';
        ctx.fillText('OWNED ' + stacks + ' / ' + c.max, r.x + r.w / 2, r.y + r.h - 20);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawVignette() {
    var g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawScanlines() {
    ctx.save();
    ctx.globalAlpha = 0.045;
    ctx.fillStyle = '#7dfcff';
    for (var y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
    ctx.restore();
  }

  function drawLogo3D(cx, cy, str, size, top, side) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + size + 'px ui-monospace, monospace';
    var depth = Math.max(6, Math.round(size * 0.15));
    for (var i = depth; i >= 1; i--) {
      ctx.fillStyle = i > depth * 0.55 ? shadeHex(side, -22) : side;
      ctx.fillText(str, cx + i * 0.75, cy + i * 1.35);
    }
    var g = ctx.createLinearGradient(0, cy - size * 0.5, 0, cy + size * 0.5);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.42, top);
    g.addColorStop(1, '#0b8fa3');
    ctx.fillStyle = g;
    ctx.shadowColor = top;
    ctx.shadowBlur = 30;
    ctx.fillText(str, cx, cy);
    ctx.shadowBlur = 0;

    var sweepY = cy - size * 0.55 + wrapNum(G.time * 95, size * 1.1);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#bffcff';
    ctx.fillRect(cx - size * 3.6, sweepY, size * 7.2, 2.5);
    ctx.restore();
  }

  function drawWireOrb(cx, cy, R, spin) {
    ctx.save();
    ctx.strokeStyle = 'rgba(125,252,255,0.16)';
    ctx.lineWidth = 1;
    for (var i = 1; i < 5; i++) {
      var yy = cy - R + (2 * R) * i / 5;
      var rad = Math.sqrt(Math.max(0, R * R - (yy - cy) * (yy - cy)));
      ctx.beginPath();
      ctx.ellipse(cx, yy, rad, rad * 0.2, 0, 0, TAU);
      ctx.stroke();
    }
    for (var j = 0; j < 7; j++) {
      var a = spin + j * Math.PI / 7;
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.abs(Math.cos(a)) * R, R, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTitleSwarm(t) {
    var types = ['grunt', 'dodger', 'shooter', 'tank', 'bomber', 'orbiter'];
    for (var i = 0; i < 6; i++) {
      var a = t * 0.22 + i * TAU / 6;
      var R = Math.min(W, H) * (0.33 + (i % 3) * 0.055);
      var x = W / 2 + Math.cos(a) * R * 1.4;
      var y = H * 0.3 + Math.sin(a) * R * 0.6;
      var ty = types[i % types.length];
      var col = ETYPES[ty].color;
      var rad = ETYPES[ty].r * 0.85;
      dropShadow(function () { enemyOutline(ctx, ty, rad); }, x, y, a + Math.PI / 2, 8);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a + Math.PI / 2);
      ctx.globalAlpha = 0.6;
      drawCraft(ty, rad, col, { livery: i % 3, wing: 1, bank: 0 }, false);
      ctx.restore();
    }
  }

  function fmtTime(s) {
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // k in 0..1 ticks the numbers up from zero
  function statRows(k) {
    var st = G.stats || { dmg: [0, 0, 0, 0], shots: 0, hits: 0, bigCrit: 0, elites: 0, maxCombo: 1, maxStreak: 0, time: 0, bosses: 0 };
    var p = G.player;
    var acc = st.shots ? Math.min(100, st.hits / st.shots * 100) : 0;
    return [
      ['SCORE', String(Math.round(G.score * k)).padStart(6, '0'), '#e6faff'],
      ['WAVE', String(Math.round(G.wave * k)), '#7dfcff'],
      ['LEVEL', String(Math.round((p ? p.level : 1) * k)), '#4ade80'],
      ['TIME', fmtTime(st.time * k), '#e6faff'],
      ['KILLS', String(Math.round(G.kills * k)), '#e6faff'],
      ['ELITES', String(Math.round(st.elites * k)), '#fbbf24'],
      ['BOSSES', String(Math.round(st.bosses * k)), '#f43f5e'],
      ['ACCURACY', Math.round(acc * k) + '%', '#7dd3fc'],
      ['BIGGEST CRIT', String(Math.round(st.bigCrit * k)), '#ffd166'],
      ['MAX COMBO', 'x' + (st.maxCombo * k).toFixed(1), '#ffd166'],
      ['BEST STREAK', String(Math.round(st.maxStreak * k)), '#fca5a5']
    ];
  }

  function drawStatPanel(x, y, w, k, title, rows) {
    var lh = 19;
    var h = 40 + rows.length * lh;
    panel(x, y, w, h, 'rgba(125,252,255,0.5)', 0.72);
    hudText(title, x + 16, y + 18, 9, 'rgba(125,252,255,0.7)');
    for (var i = 0; i < rows.length; i++) {
      var ry = y + 42 + i * lh;
      var rk = clamp(k * rows.length - i * 0.6, 0, 1);
      ctx.save();
      ctx.globalAlpha *= rk;
      hudText(rows[i][0], x + 16, ry, 10, 'rgba(230,247,255,0.5)');
      hudText(rows[i][1], x + w - 16, ry, 12, rows[i][2], 'right');
      ctx.restore();
    }
    return h;
  }

  function drawBuildPanel(x, y, w, k) {
    var p = G.player;
    var st = G.stats;
    var h = 0;
    var wy = y + 42;
    var owned = [];
    for (var c = 0; c < CARDS.length; c++) if (p && cardStacks(p, CARDS[c].id) > 0) owned.push(CARDS[c]);
    var cell = 36, per = Math.max(1, Math.floor((w - 24) / cell));
    var cardRows = Math.max(1, Math.ceil(owned.length / per));
    h = 42 + 4 * 30 + 30 + cardRows * cell + 14;
    panel(x, y, w, h, 'rgba(240,171,252,0.5)', 0.72);
    hudText('DAMAGE BY WEAPON', x + 16, y + 18, 9, 'rgba(240,171,252,0.75)');
    var maxD = 1, i;
    if (st) for (i = 0; i < 4; i++) maxD = Math.max(maxD, st.dmg[i]);
    for (i = 0; i < WEAPONS.length; i++) {
      var wd = WEAPONS[i];
      var dv = st ? st.dmg[i] : 0;
      var by = wy + i * 30;
      hudText(wd.name, x + 16, by, 9, dv > 0 ? wd.color : 'rgba(230,247,255,0.25)');
      hudText(String(Math.round(dv * k)), x + w - 16, by, 9, 'rgba(230,247,255,0.6)', 'right');
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      rr(ctx, x + 16, by + 8, w - 32, 5, 2); ctx.fill();
      if (dv > 0) {
        ctx.save();
        ctx.shadowColor = wd.color; ctx.shadowBlur = 8;
        ctx.fillStyle = wd.color;
        rr(ctx, x + 16, by + 8, Math.max(3, (w - 32) * (dv / maxD) * k), 5, 2); ctx.fill();
        ctx.restore();
      }
    }
    var cy0 = wy + 4 * 30 + 6;
    hudText('BUILD  ·  ' + owned.length + ' UPGRADES', x + 16, cy0, 9, 'rgba(240,171,252,0.75)');
    if (!owned.length) hudText('NO UPGRADES TAKEN', x + 16, cy0 + 26, 9, 'rgba(230,247,255,0.3)');
    for (i = 0; i < owned.length; i++) {
      var cc = owned[i];
      var gx = x + 12 + (i % per) * cell + cell / 2;
      var gy = cy0 + 24 + Math.floor(i / per) * cell;
      var col = RCOLOR[cc.r];
      ctx.save();
      ctx.globalAlpha *= clamp(k * 2 - i * 0.05, 0, 1);
      ctx.fillStyle = withAlpha(col, 0.1);
      rr(ctx, gx - 15, gy - 15, 30, 30, 6); ctx.fill();
      ctx.translate(gx, gy);
      ctx.scale(0.8, 0.8);
      drawSkillIcon(cc.id, col, G.time);
      ctx.restore();
      var n = cardStacks(p, cc.id);
      if (n > 1) hudText('x' + n, gx + 14, gy + 12, 8, '#ffffff', 'right');
    }
    return h;
  }

  function drawGameOver() {
    var a = clamp(G.gameOverT, 0, 1);
    var k = clamp((G.gameOverT - 0.5) / 1.3, 0, 1);
    k = 1 - Math.pow(1 - k, 3);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(4,5,10,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    // glitching title
    var ty = Math.max(54, H * 0.1);
    ctx.font = 'bold ' + Math.round(clamp(W * 0.07, 34, 54)) + 'px ui-monospace, monospace';
    var gl = Math.random() < 0.12 ? rand(-6, 6) : 0;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,40,80,0.6)';
    ctx.fillText('SIGNAL LOST', W / 2 - 3 + gl, ty);
    ctx.fillStyle = 'rgba(40,220,255,0.5)';
    ctx.fillText('SIGNAL LOST', W / 2 + 3 - gl, ty);
    ctx.restore();
    ctx.shadowColor = '#f43f5e'; ctx.shadowBlur = 28;
    ctx.fillStyle = '#ffd7de';
    ctx.fillText('SIGNAL LOST', W / 2, ty);
    ctx.shadowBlur = 0;

    var sub = (G.daily ? 'DAILY CHALLENGE  ·  ' : (G.mods.length ? 'MUTATORS x' + G.scoreMul.toFixed(2) + '  ·  ' : '')) +
      'BEST ' + String(G.best).padStart(6, '0') + '  ·  BEST WAVE ' + G.bestWave;
    hudText(sub, W / 2, ty + 38, 10, 'rgba(230,247,255,0.55)', 'center');
    if (G.newRecord || G.newModeRecord) {
      ctx.save();
      ctx.globalAlpha *= 0.6 + 0.4 * Math.sin(G.time * 6);
      hudText(G.newRecord ? '★  NEW RECORD  ★' : '★  NEW MODE RECORD  ★', W / 2, ty + 58, 12, '#ffd166', 'center');
      ctx.restore();
    }

    var top = ty + 78, ph;
    if (W >= 760) {
      var pw = Math.min(360, (W - 60) / 2);
      var h1 = drawStatPanel(W / 2 - pw - 10, top, pw, k, 'RUN SUMMARY', statRows(k));
      var h2 = drawBuildPanel(W / 2 + 10, top, pw, k);
      ph = Math.max(h1, h2);
    } else {
      var pw2 = Math.min(360, W - 32);
      var rows = statRows(k);
      ph = drawStatPanel(W / 2 - pw2 / 2, top, pw2, k, 'RUN SUMMARY', rows.slice(0, 8));
      ph += 10 + drawBuildPanel(W / 2 - pw2 / 2, top + ph + 10, pw2, k);
    }

    if (G.gameOverT > 0.8) {
      ctx.font = 'bold 15px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(125,252,255,' + (0.55 + 0.45 * Math.sin(G.time * 6)) + ')';
      ctx.fillText(G.mobile ? 'TAP  TO  REDEPLOY' : 'CLICK  OR  PRESS  ENTER  TO  REDEPLOY', W / 2, Math.min(H - 24, top + ph + 34));
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- flow
  function startGame() {
    initAudio();
    sfx.ui();
    G.state = 'playing';
    G.score = 0; G.wave = 0; G.kills = 0; G.combo = 1; G.comboT = 0;
    G.bullets = []; G.ebullets = []; G.enemies = []; G.parts = [];
    G.drops = []; G.texts = []; G.rings = []; G.ghosts = []; G.contrail = [];
    G.spawnQueue = []; G.betweenWaves = 0; G.shake = 0; G.flash = 0;
    G.hitStop = 0; G.slowmo = 0; G.gameOverT = 0; G.waveBanner = 0;
    G.mines = []; G.bossNum = 0; G.streak = 0; G.streakT = 0;
    G.cards = []; G.toast = ''; G.toastT = 0; G.newRecord = false; G.newModeRecord = false;
    G.gems = []; G.shards = []; G.gemChain = 0; G.pendingCards = 0; G.levelUpDelay = 0; G.levelFx = 0;
    G.scoreShown = 0; G.scorePop = 0; G.aberr = 0; G.heartT = 0; G.upgradeReason = 'wave';
    G.stats = { dmg: [0, 0, 0, 0], shots: 0, hits: 0, bigCrit: 0, elites: 0, maxCombo: 1, maxStreak: 0, time: 0, bosses: 0 };
    G.mods = selectedMods();
    G.scoreMul = modsMul(G.mods);
    G.modeKey = modsKey(G.mods);
    G.games++;
    saveRecords();
    keys[' '] = false;
    G.player = makePlayer();
    if (modOn('glass')) { G.player.maxHp = G.player.hp = 50; G.player.dmgMul = 1.6; }
    G.time = 0;
    startWave(1);
  }

  function gameOver() {
    G.state = 'over';
    G.gameOverT = 0;
    G.newRecord = G.score > G.best;
    G.best = Math.max(G.best, G.score);
    G.bestWave = Math.max(G.bestWave, G.wave);
    var prevMode = G.bestByMode[G.modeKey] || 0;
    G.newModeRecord = G.score > prevMode && G.modeKey !== 'STANDARD';
    G.bestByMode[G.modeKey] = Math.max(prevMode, G.score);
    saveRecords();
    G.aberr = Math.max(G.aberr, 0.8);
    sfx.gameover();
    shake(26);
    flash(0.8, '255,60,90');
    if (G.player) burst(G.player.x, G.player.y, 70, '#ff6b8a', 420, 6);
  }

  // ---------------------------------------------------------------- records
  function loadRecords() {
    try {
      var raw = window.localStorage.getItem('neonvanguard_save');
      if (raw) {
        var d = JSON.parse(raw);
        G.best = d.best || 0;
        G.bestWave = d.bestWave || 0;
        G.totalKills = d.kills || 0;
        G.games = d.games || 0;
        G.bestByMode = d.modes && typeof d.modes === 'object' ? d.modes : {};
        if (d.mut && typeof d.mut === 'object') G.mutSel = d.mut;
        G.daily = !!d.daily;
      } else {
        var bs = window.localStorage.getItem('neonvanguard_best');
        if (bs) G.best = parseInt(bs, 10) || 0;
      }
    } catch (e) {}
  }
  function saveRecords() {
    try {
      window.localStorage.setItem('neonvanguard_save', JSON.stringify({
        best: G.best, bestWave: G.bestWave, kills: G.totalKills, games: G.games,
        modes: G.bestByMode, mut: G.mutSel, daily: G.daily
      }));
    } catch (e) {}
  }

  // ---------------------------------------------------------------- loop
  var lastT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 1 / 30);

    ctx.clearRect(0, 0, W, H);

    if (G.slowmo > 0) G.slowmo = Math.max(0, G.slowmo - dt);
    if (G.state === 'upgrade') G.upgradeT += dt;

    if (G.state === 'playing') {
      if (G.hitStop > 0) {
        G.hitStop -= dt;
      } else {
        var gdt = dt * (G.slowmo > 0 ? 0.35 : 1) * (modOn('clock') ? 1.25 : 1);
        update(gdt);
      }
      G.time += dt * 0.0001; // tiny extra for shimmer stability
    } else if (G.state === 'over') {
      G.gameOverT += dt;
      G.time += dt;
      updateFx(dt);
      // keep a little motion in the background
    } else {
      G.time += dt;
      updateFx(dt);
    }

    scheduleMusic();

    var slow = G.state === 'playing' && G.player && G.player.odActive > 0;
    ctx.save();
    var camShake = G.state === 'playing' || G.state === 'over' ? 1 : 0;
    ctx.translate(G.shakeX * camShake, G.shakeY * camShake);

    drawBackground();

    if (G.state === 'title') {
      drawGrid();
      drawTitle();
    } else {
      drawGrid();
      drawMines();
      drawGems();
      drawDrops();
      for (var i = 0; i < G.enemies.length; i++) drawEnemy(G.enemies[i]);
      drawShards();
      drawBullets();
      drawLevelFx();
      if (G.player && !G.player.dead) drawPlayer();
      drawParticles();
      drawTexts();
      if (G.state === 'playing') {
        drawOffscreen();
        drawBossBar();
        drawHud();
      }
      drawWaveBanner();
    }

    ctx.restore();

    if (G.aberr > 0.02) drawAberration(G.aberr);

    if (slow) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(60,220,255,0.07)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    if (G.flash > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(' + G.flashColor + ',' + (G.flash * 0.5) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    drawVignette();
    drawScanlines();

    // low hp warning: red edge vignette that thumps with the heartbeat
    if (G.state === 'playing' && G.player && !G.player.dead && G.player.hp / G.player.maxHp < 0.28) {
      var beat = G.heartPulse || 0;
      var lowg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.7);
      lowg.addColorStop(0, 'rgba(239,68,68,0)');
      lowg.addColorStop(1, 'rgba(239,68,68,' + (0.28 + 0.3 * beat) + ')');
      ctx.fillStyle = lowg;
      ctx.fillRect(0, 0, W, H);
    }

    if (G.state === 'playing') drawCrosshair();
    if (G.state === 'playing' && G.mobile) drawTouchControls();

    // hide the OS cursor while the in-game crosshair is shown
    var wantNoCursor = G.state === 'playing' && mouse.active;
    if (wantNoCursor !== cvs.classList.contains('nocursor')) cvs.classList.toggle('nocursor', wantNoCursor);

    if (G.state === 'paused') drawPause();
    if (G.state === 'upgrade') drawUpgrade();
    if (G.state === 'over') drawGameOver();
  }

  // RGB split + scanline tear on heavy impacts
  var abA = null, abB = null;
  function drawAberration(k) {
    var cw = cvs.width, ch = cvs.height;
    if (!abA) { abA = document.createElement('canvas'); abB = document.createElement('canvas'); }
    if (abA.width !== cw || abA.height !== ch) { abA.width = abB.width = cw; abA.height = abB.height = ch; }
    var ca = abA.getContext('2d'), cb = abB.getContext('2d');
    ca.globalCompositeOperation = 'copy'; ca.drawImage(cvs, 0, 0);
    ca.globalCompositeOperation = 'multiply'; ca.fillStyle = '#ff0000'; ca.fillRect(0, 0, cw, ch);
    cb.globalCompositeOperation = 'copy'; cb.drawImage(cvs, 0, 0);
    cb.globalCompositeOperation = 'multiply'; cb.fillStyle = '#00ffff'; cb.fillRect(0, 0, cw, ch);
    var off = Math.round(k * 12 * DPR);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.min(0.55, k * 0.7);
    ctx.drawImage(abA, off, 0);
    ctx.drawImage(abB, -off, 0);
    ctx.globalCompositeOperation = 'source-over';
    if (k > 0.3) {
      ctx.globalAlpha = 1;
      var strips = Math.round(k * 5);
      for (var i = 0; i < strips; i++) {
        var sy = Math.floor(Math.random() * ch), sh = Math.floor(rand(4, 22) * DPR);
        var dx = Math.round(rand(-30, 30) * k * DPR);
        ctx.drawImage(cvs, 0, sy, cw, sh, dx, sy, cw, sh);
      }
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- boot
  if (typeof window !== 'undefined') {
    window.NEON = {
      G: G, startWave: startWave, openUpgrade: openUpgrade, pickCard: pickCard,
      selectWeapon: selectWeapon, placeMine: placeMine, tryOverdrive: tryOverdrive,
      spawnEnemy: spawnEnemy, killEnemy: killEnemy, CARDS: CARDS, WEAPONS: WEAPONS,
      frame: frame, gainXp: gainXp, makeElite: makeElite, AFFIXES: AFFIXES, MUTATORS: MUTATORS,
      toggleMutator: toggleMutator, startGame: startGame, hurtPlayer: hurtPlayer,
      drawCraft: drawCraft, steerBank: steerBank, enemyOutline: enemyOutline, ETYPES: ETYPES, BOSSES: BOSSES, PLAYER_LOOK: PLAYER_LOOK, drawSkillIcon: drawSkillIcon,
      resize: resize, touchLayout: touchLayout, touchButtonAt: touchButtonAt, pressTouchButton: pressTouchButton, nextWeapon: nextWeapon
    };
  }
  loadRecords();
  resize();
  G.player = makePlayer();
  requestAnimationFrame(function (t) { lastT = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
