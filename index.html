<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NEON VANGUARD</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #04050a; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #e6f7ff;
    cursor: crosshair;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #c { display: block; position: fixed; inset: 0; }
  #c.nocursor { cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  /* ============================================================
     NEON VANGUARD  -  arcade twin-stick survival shooter
     Everything (art, audio, AI) generated procedurally. No assets.
     ============================================================ */

  // ---------------------------------------------------------------- canvas
  var cvs = document.getElementById('c');
  var ctx = cvs.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    craftSprites = {}; // sprites are baked at the old DPR
    buildStars();
  }
  window.addEventListener('resize', resize);

  // ---------------------------------------------------------------- helpers
  var TAU = Math.PI * 2;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
  function len(x, y) { return Math.sqrt(x * x + y * y); }

  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function poly(c, x, y, r, sides, rot) {
    c.beginPath();
    for (var i = 0; i < sides; i++) {
      var a = rot + i * TAU / sides;
      var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
  }

  // ---------------------------------------------------------------- depth + ui helpers
  function colorRgb(hex) {
    var h = hex.charAt(0) === '#' ? hex.slice(1) : hex;
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    if (!isFinite(n)) return { r: 255, g: 255, b: 255 };
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function withAlpha(hex, a) {
    var c = colorRgb(hex);
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
  }

  function shadeHex(hex, amt) {
    var c = colorRgb(hex);
    var f = function (v) { return Math.round(clamp(v + amt, 0, 255)); };
    return 'rgb(' + f(c.r) + ',' + f(c.g) + ',' + f(c.b) + ')';
  }

  function wrapNum(v, m) { return ((v % m) + m) % m; }

  // sun-cast drop shadow: the silhouette offset away from the light, higher craft cast farther
  function dropShadow(build, x, y, ang, alt) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#000000';
    ctx.translate(x + alt * 0.6, y + alt);
    ctx.rotate(ang);
    build();
    ctx.fill();
    ctx.restore();
  }

  // brushed-metal hull gradient across the wingspan; the sheen slides with bank
  // player-only palette: no ETYPES/BOSSES color may match these
  var PLAYER_LOOK = { hull: '#e8edf2', trim: '#ffcf5c', engine: '#bfe3ff' };

  function metalFill(r, color, bank, flash, dark) {
    var g = ctx.createLinearGradient(0, -r, 0, r);
    if (flash) {
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.5, '#ffe3ea');
      g.addColorStop(1, '#ff9ab5');
      return g;
    }
    g.addColorStop(0, shadeHex(color, -30));
    g.addColorStop(clamp(0.3 + (bank || 0) * 0.2, 0.05, 0.95), 'rgba(255,255,255,0.18)');
    g.addColorStop(0.5, shadeHex(color, -115));
    g.addColorStop(1, dark || '#05080f');
    return g;
  }

  // angular glass panel with corner brackets
  function panel(x, y, w, h, accent, alpha) {
    ctx.save();
    ctx.fillStyle = 'rgba(6,11,20,' + (alpha === undefined ? 0.62 : alpha) + ')';
    rr(ctx, x, y, w, h, 9);
    ctx.fill();
    ctx.strokeStyle = 'rgba(125,252,255,0.12)';
    ctx.lineWidth = 1;
    rr(ctx, x, y, w, h, 9);
    ctx.stroke();
    ctx.strokeStyle = accent || 'rgba(125,252,255,0.5)';
    ctx.lineWidth = 1.6;
    var L = 9;
    ctx.beginPath();
    ctx.moveTo(x + 1.5, y + L); ctx.lineTo(x + 1.5, y + 1.5); ctx.lineTo(x + L, y + 1.5);
    ctx.moveTo(x + w - L, y + 1.5); ctx.lineTo(x + w - 1.5, y + 1.5); ctx.lineTo(x + w - 1.5, y + L);
    ctx.moveTo(x + 1.5, y + h - L); ctx.lineTo(x + 1.5, y + h - 1.5); ctx.lineTo(x + L, y + h - 1.5);
    ctx.moveTo(x + w - L, y + h - 1.5); ctx.lineTo(x + w - 1.5, y + h - 1.5); ctx.lineTo(x + w - 1.5, y + h - L);
    ctx.stroke();
    ctx.restore();
  }

  function hudText(str, x, y, size, color, align) {
    ctx.save();
    ctx.font = 'bold ' + size + 'px ui-monospace, monospace';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  // ---------------------------------------------------------------- audio
  var AC = null, master = null, noiseBuf = null;

  function initAudio() {
    if (AC) { if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} } return; }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    AC = new Ctx();
    master = AC.createGain();
    master.gain.value = 0.42;
    master.connect(AC.destination);
  }

  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!AC) return;
    type = type || 'square'; vol = vol == null ? 0.16 : vol; delay = delay || 0;
    var t = AC.currentTime + delay;
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }

  function noiseBurst(dur, vol, cut, q, delay) {
    if (!AC) return;
    dur = dur || 0.3; vol = vol == null ? 0.26 : vol; cut = cut || 1200; q = q || 1; delay = delay || 0;
    if (!noiseBuf) {
      var n = Math.floor(AC.sampleRate * 0.6);
      noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    var t = AC.currentTime + delay;
    var src = AC.createBufferSource();
    src.buffer = noiseBuf;
    var f = AC.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(cut, t);
    f.Q.value = q;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }

  var sfx = {
    shoot: function () { tone(rand(680, 760), 0.06, 'square', 0.055, 260); },
    shootBig: function () { tone(rand(300, 340), 0.09, 'sawtooth', 0.07, 120); noiseBurst(0.08, 0.06, 2200, 1); },
    hit: function () { tone(rand(900, 1100), 0.04, 'square', 0.04, 500); },
    kill: function () { noiseBurst(0.22, 0.22, 1500, 1); tone(rand(150, 200), 0.16, 'sawtooth', 0.09, 60); },
    bigKill: function () { noiseBurst(0.6, 0.35, 900, 1); tone(90, 0.5, 'sawtooth', 0.16, 40); tone(140, 0.4, 'square', 0.08, 50, 0.05); },
    hurt: function () { tone(140, 0.22, 'sawtooth', 0.18, 60); noiseBurst(0.18, 0.16, 700, 1); },
    dash: function () { tone(500, 0.12, 'sine', 0.09, 1400); noiseBurst(0.1, 0.05, 3000, 1); },
    power: function () { tone(660, 0.09, 'square', 0.12); tone(990, 0.12, 'square', 0.12, null, 0.08); tone(1320, 0.16, 'square', 0.1, null, 0.16); },
    wave: function () { tone(330, 0.14, 'square', 0.1); tone(440, 0.14, 'square', 0.1, null, 0.12); tone(660, 0.24, 'square', 0.11, null, 0.24); },
    boss: function () { tone(70, 1.0, 'sawtooth', 0.2, 42); noiseBurst(1.0, 0.2, 500, 1); tone(110, 0.9, 'square', 0.09, 60, 0.1); },
    overdrive: function () { tone(220, 0.5, 'sawtooth', 0.16, 880); tone(330, 0.5, 'sine', 0.12, 1320, 0.05); noiseBurst(0.5, 0.12, 4000, 1); },
    gameover: function () { tone(300, 0.7, 'sawtooth', 0.16, 60); tone(200, 0.9, 'square', 0.1, 40, 0.15); },
    ui: function () { tone(880, 0.06, 'square', 0.07); },
    card: function () { tone(523, 0.07, 'square', 0.1); tone(784, 0.1, 'square', 0.1, null, 0.06); tone(1046, 0.14, 'square', 0.09, null, 0.13); },
    unlock: function () { tone(392, 0.1, 'square', 0.12); tone(587, 0.12, 'square', 0.12, null, 0.1); tone(784, 0.2, 'square', 0.12, null, 0.22); },
    mine: function () { tone(160, 0.12, 'sine', 0.12, 60); },
    laser: function () { tone(1200, 0.14, 'sawtooth', 0.07, 300); },
    missile: function () { noiseBurst(0.16, 0.1, 1400, 1); tone(300, 0.2, 'sawtooth', 0.05, 900); },
    streak: function () { tone(587, 0.09, 'square', 0.1); tone(880, 0.09, 'square', 0.1, null, 0.07); },
    gem: function (k) { var f = 760 * Math.pow(1.06, Math.min(k || 0, 24)); tone(f, 0.05, 'sine', 0.05, f * 1.5); },
    levelup: function () { tone(523, 0.1, 'square', 0.11); tone(659, 0.1, 'square', 0.11, null, 0.08); tone(784, 0.1, 'square', 0.11, null, 0.16); tone(1046, 0.3, 'triangle', 0.13, null, 0.24); },
    heart: function () { tone(62, 0.12, 'sine', 0.22, 40); tone(58, 0.14, 'sine', 0.16, 38, 0.16); },
    elite: function () { tone(180, 0.3, 'sawtooth', 0.09, 360); tone(270, 0.3, 'square', 0.05, 540, 0.04); },
    shieldBreak: function () { tone(1400, 0.12, 'triangle', 0.08, 300); noiseBurst(0.15, 0.1, 5000, 1); },
    toggle: function (on) { tone(on ? 660 : 440, 0.06, 'square', 0.07); tone(on ? 990 : 330, 0.08, 'square', 0.06, null, 0.05); }
  };

  // ---------------------------------------------------------------- music (procedural sequencer)
  var mus = {
    next: 0, step: 0,
    bass: [55, 0, 0, 82.41, 0, 0, 61.74, 0, 49, 0, 0, 73.42, 0, 0, 55, 0],
    lead: [440, 0, 523.25, 0, 587.33, 0, 523.25, 0, 659.25, 0, 587.33, 0, 523.25, 0, 392, 0]
  };

  function toneAbs(freq, dur, type, vol, when, slideTo) {
    if (!AC) return;
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, when);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), when + dur);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(master);
    o.start(when); o.stop(when + dur + 0.03);
  }

  function noiseAbs(dur, vol, cut, when) {
    if (!AC) return;
    if (!noiseBuf) {
      var n = Math.floor(AC.sampleRate * 0.6);
      noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    var src = AC.createBufferSource();
    src.buffer = noiseBuf;
    var f = AC.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(cut, when); f.Q.value = 1;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(when); src.stop(when + dur + 0.02);
  }

  function bossAlive() {
    for (var i = 0; i < G.enemies.length; i++) if (G.enemies[i].boss && !G.enemies[i].dead) return true;
    return false;
  }

  function scheduleMusic() {
    if (!AC || !G.musicOn || G.muted) return;
    if (G.state !== 'playing' && G.state !== 'upgrade') { mus.next = 0; return; }
    var t = AC.currentTime;
    if (mus.next < t) { mus.next = t + 0.06; }
    var tempo = bossAlive() ? 0.108 : 0.135;
    var guard = 0;
    while (mus.next < t + 0.25 && guard++ < 64) {
      var s = mus.step;
      var b = mus.bass[s];
      if (b) toneAbs(b, 0.24, 'triangle', 0.10, mus.next);
      var l = mus.lead[s];
      if (l) toneAbs(l, 0.10, 'square', 0.032, mus.next);
      if (s % 2 === 0) noiseAbs(0.04, 0.035, 7000, mus.next);
      if (s % 8 === 0) noiseAbs(0.15, 0.08, 200, mus.next);
      if (s === 8) noiseAbs(0.2, 0.07, 400, mus.next);
      mus.step = (s + 1) % 16;
      mus.next += tempo;
    }
  }

  // ---------------------------------------------------------------- starfield
  var stars = [], dust = [];
  var NEBS = [
    { x: 0.22, y: 0.26, r: 0.44, a: 0.085, c: '#7c3aed', vx: 6, vy: 3 },
    { x: 0.80, y: 0.20, r: 0.38, a: 0.075, c: '#0891b2', vx: -4, vy: 2 },
    { x: 0.56, y: 0.80, r: 0.50, a: 0.055, c: '#db2777', vx: 3, vy: -3 }
  ];

  function buildStars() {
    stars = [];
    var count = Math.round((W * H) / 21000);
    for (var i = 0; i < count; i++) {
      var z = Math.random();
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        z: z,
        r: 0.6 + z * 2.2,
        a: 0.16 + z * 0.62,
        s: 5 + z * 46,
        hue: 180 + Math.random() * 50,
        ph: Math.random() * TAU
      });
    }
    dust = [];
    var dc = Math.round((W * H) / 110000);
    for (var j = 0; j < dc; j++) {
      dust.push({
        x: Math.random() * W, y: Math.random() * H,
        z: 0.3 + Math.random() * 0.7,
        ph: Math.random() * TAU
      });
    }
  }

  // ---------------------------------------------------------------- game state
  var G = {
    state: 'title',            // title | playing | paused | upgrade | over
    time: 0,
    last: 0,
    shake: 0,
    shakeX: 0, shakeY: 0,
    flash: 0, flashColor: '255,60,90',
    hitStop: 0,
    slowmo: 0,
    score: 0,
    best: 0,
    bestWave: 0,
    totalKills: 0,
    games: 0,
    wave: 0,
    kills: 0,
    combo: 1,
    comboT: 0,
    waveBanner: 0,
    waveBannerText: '',
    betweenWaves: 0,
    spawnQueue: [],
    bullets: [], ebullets: [], enemies: [], parts: [], drops: [], texts: [], rings: [], ghosts: [], mines: [], contrail: [],
    player: null,
    bannerFlash: 0,
    gameOverT: 0,
    streak: 0,
    streakT: 0,
    cards: [],
    cardRects: [],
    pendingCards: 0,
    bossNum: 0,
    toast: '',
    toastT: 0,
    musicOn: true,
    muted: false,
    // ---- xp / level-up ----
    gems: [], shards: [], gemChain: 0, gemChainT: 0,
    upgradeReason: 'wave', upgradeT: 0, levelUpDelay: 0, levelFx: 0,
    // ---- mutators ----
    mutSel: {}, daily: false, mods: [], scoreMul: 1, modeKey: 'STANDARD', bestByMode: {}, mutRects: [],
    // ---- run stats + fx ----
    stats: null, scoreShown: 0, scorePop: 0, aberr: 0, heartT: 0
  };

  // ---------------------------------------------------------------- input
  var keys = Object.create(null);
  // dash is polled in update(), which hit-stop skips; remember the press so a quick tap isn't lost
  var dashQueued = false;
  var mouse = { x: 0, y: 0, down: false, active: false };
  var touch = { moveId: null, mx: 0, my: 0, mvx: 0, mvy: 0, aimId: null, ax: 0, ay: 0, avx: 0, avy: 0, ox: 0, oy: 0, buttons: {} };

  // ---------------------------------------------------------------- mobile controls
  // pointer:coarse means the main input is a finger; a touch laptop driven by mouse stays desktop
  G.mobile = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

  // sticks bottom-left/right, action arc above-left of the aim stick, weapon above the move stick
  function touchLayout(w, h) {
    var r = clamp(Math.min(w, h) * 0.16, 48, 80), br = 30, d = r + br + 12;
    var move = { x: r + 28, y: h - r - 28, r: r };
    var aim = { x: w - r - 28, y: h - r - 28, r: r };
    function arc(id, ang) { return { id: id, x: aim.x + Math.cos(ang) * d, y: aim.y + Math.sin(ang) * d, r: br }; }
    return {
      move: move, aim: aim,
      buttons: [
        arc('dash', Math.PI), arc('mine', Math.PI * 1.25), arc('od', Math.PI * 1.5),
        { id: 'weapon', x: move.x, y: move.y - d, r: br },
        { id: 'pause', x: w - br - 16, y: 150, r: br }
      ]
    };
  }

  function touchButtonAt(x, y) {
    var b = touchLayout(W, H).buttons;
    for (var i = 0; i < b.length; i++) if (dist(x, y, b[i].x, b[i].y) <= b[i].r) return b[i].id;
    return null;
  }

  // cycle to the next unlocked weapon; with only PULSE unlocked it stays put
  function nextWeapon() {
    var p = G.player;
    if (!p) return;
    for (var i = 1; i < WEAPONS.length; i++) {
      var j = (p.weapon + i) % WEAPONS.length;
      if (p.unlocked[j]) { selectWeapon(j); return; }
    }
  }

  function pressTouchButton(id) {
    if (id === 'pause') {
      if (G.state === 'playing') G.state = 'paused';
      else if (G.state === 'paused') G.state = 'playing';
      sfx.ui();
      return;
    }
    if (G.state !== 'playing') return;
    if (id === 'dash') { keys[' '] = true; dashQueued = true; } // held until the finger lifts, same as the space bar latch
    else if (id === 'mine') placeMine();
    else if (id === 'od') tryOverdrive();
    else if (id === 'weapon') nextWeapon();
  }

  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    var wasDown = !!keys[k];
    keys[k] = true;
    if (k === ' ' && !wasDown && G.state === 'playing') dashQueued = true;
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) e.preventDefault();

    if (G.state === 'upgrade') {
      if (k === '1' || k === '2' || k === '3') pickCard(parseInt(k, 10) - 1);
      else if (k === 'enter') pickCard(0);
      return;
    }

    if (G.state === 'title') {
      for (var mk = 0; mk < MUTATORS.length; mk++) {
        if (k === MUTATORS[mk].key) { toggleMutator(MUTATORS[mk].id); return; }
      }
      if (k === 't') { toggleMutator('daily'); return; }
    }

    if (e.code === 'Escape' || k === 'p') {
      if (G.state === 'playing') { G.state = 'paused'; sfx.ui(); }
      else if (G.state === 'paused') { G.state = 'playing'; sfx.ui(); }
    }
    if (k === 'enter' || e.key === ' ') {
      if (G.state === 'title') startGame();
      else if (G.state === 'over' && G.gameOverT > 0.8) startGame();
    }
    if (k === 'm') {
      G.muted = !G.muted;
      if (master) master.gain.value = G.muted ? 0 : 0.42;
      G.toast = G.muted ? 'AUDIO MUTED' : 'AUDIO ON';
      G.toastT = 1.6;
    }
    if (G.state === 'playing') {
      if (k === 'q') tryOverdrive();
      if (k === 'e' && !wasDown) placeMine();
      if (k === '1') selectWeapon(0);
      if (k === '2') selectWeapon(1);
      if (k === '3') selectWeapon(2);
      if (k === '4') selectWeapon(3);
    }
  });
  window.addEventListener('keyup', function (e) {
    keys[e.key.toLowerCase()] = false;
  });

  cvs.addEventListener('mousemove', function (e) {
    var r = cvs.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
    mouse.active = true;
  });
  cvs.addEventListener('mousedown', function (e) {
    initAudio();
    var rect = cvs.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;

    if (G.state === 'upgrade') {
      if (e.button === 0) {
        var rects = cardRects();
        for (var i = 0; i < rects.length; i++) {
          var rc = rects[i];
          if (mx >= rc.x && mx <= rc.x + rc.w && my >= rc.y && my <= rc.y + rc.h) { pickCard(i); break; }
        }
      }
      return;
    }
    if (e.button === 2) {
      if (G.state === 'playing') placeMine();
      return;
    }
    mouse.down = true;
    mouse.x = mx; mouse.y = my;
    mouse.active = true;
    if (G.state === 'title' && mutatorHit(mx, my)) { mouse.down = false; return; }
    if (G.state === 'title') startGame();
    else if (G.state === 'over' && G.gameOverT > 0.8) startGame();
  });
  window.addEventListener('mouseup', function () { mouse.down = false; });
  cvs.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function tpos(t, r) { return { x: t.clientX - r.left, y: t.clientY - r.top }; }

  cvs.addEventListener('touchstart', function (e) {
    initAudio();
    e.preventDefault();
    var r = cvs.getBoundingClientRect();
    if (G.state === 'upgrade') {
      var t0 = e.changedTouches[0];
      if (t0) {
        var p0 = tpos(t0, r);
        var rr0 = cardRects();
        for (var q0 = 0; q0 < rr0.length; q0++) {
          var rc0 = rr0[q0];
          if (p0.x >= rc0.x && p0.x <= rc0.x + rc0.w && p0.y >= rc0.y && p0.y <= rc0.y + rc0.h) { pickCard(q0); return; }
        }
      }
      return;
    }
    if (G.state === 'title') {
      var tt = e.changedTouches[0];
      if (tt) { var tp = tpos(tt, r); if (mutatorHit(tp.x, tp.y)) return; }
      startGame(); return;
    }
    if (G.state === 'over' && G.gameOverT > 0.8) { startGame(); return; }
    if (G.state !== 'playing' && G.state !== 'paused') return; // e.g. the first 0.8 s of game over
    G.mobile = true;
    // no Escape key on a phone: any tap resumes
    if (G.state === 'paused') { pressTouchButton('pause'); return; }
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      var p = tpos(t, r);
      var btn = touchButtonAt(p.x, p.y);
      if (btn) { touch.buttons[t.identifier] = btn; pressTouchButton(btn); continue; }
      if (p.x < W * 0.5 && touch.moveId === null) {
        touch.moveId = t.identifier;
        touch.ox = p.x; touch.oy = p.y; touch.mvx = 0; touch.mvy = 0;
      } else if (touch.aimId === null) {
        touch.aimId = t.identifier;
        touch.ax = p.x; touch.ay = p.y; touch.avx = 1; touch.avy = 0;
      }
    }
  }, { passive: false });

  cvs.addEventListener('touchmove', function (e) {
    e.preventDefault();
    var r = cvs.getBoundingClientRect();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      var p = tpos(t, r);
      if (t.identifier === touch.moveId) {
        var dx = p.x - touch.ox, dy = p.y - touch.oy, d = len(dx, dy) || 1;
        var m = Math.min(d, 70) / 70;
        touch.mvx = dx / d * m; touch.mvy = dy / d * m;
        touch.mx = p.x; touch.my = p.y;
      } else if (t.identifier === touch.aimId) {
        var ax = p.x - touch.ax, ay = p.y - touch.ay, ad = len(ax, ay);
        if (ad > 6) { touch.avx = ax / ad; touch.avy = ay / ad; }
        touch.mx = p.x; touch.my = p.y;
      }
    }
  }, { passive: false });

  function touchEnd(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var id = e.changedTouches[i].identifier;
      if (touch.buttons[id]) {
        if (touch.buttons[id] === 'dash') keys[' '] = false;
        delete touch.buttons[id];
        continue;
      }
      if (id === touch.moveId) { touch.moveId = null; touch.mvx = 0; touch.mvy = 0; }
      if (id === touch.aimId) { touch.aimId = null; touch.avx = 0; touch.avy = 0; }
    }
  }

  var RWEIGHT = { common: 6, rare: 3, epic: 1 };

  function cardStacks(p, id) { return p.stacks[id] || 0; }

  function rollCards(n) {
    var uniq = [];
    for (var i = 0; i < CARDS.length; i++) {
      if (cardStacks(G.player, CARDS[i].id) < CARDS[i].max) uniq.push(CARDS[i]);
    }
    var out = [];
    while (out.length < n && uniq.length) {
      var total = 0, k;
      for (k = 0; k < uniq.length; k++) total += RWEIGHT[uniq[k].r] || 1;
      var r = Math.random() * total, acc = 0, chosen = uniq[0];
      for (k = 0; k < uniq.length; k++) {
        acc += RWEIGHT[uniq[k].r] || 1;
        if (r <= acc) { chosen = uniq[k]; break; }
      }
      out.push(chosen);
      uniq.splice(uniq.indexOf(chosen), 1);
    }
    return out;
  }

  function openUpgrade(reason) {
    G.upgradeReason = reason || 'wave';
    G.cards = rollCards(3);
    if (!G.cards.length) {
      if (G.upgradeReason === 'wave') startWave(G.wave + 1);
      return;
    }
    G.state = 'upgrade';
    G.upgradeT = 0;
    mouse.down = false;
    sfx.card();
  }

  function pickCard(i) {
    var c = G.cards[i];
    if (!c || G.upgradeT < 0.4) return;
    var p = G.player;
    c.ap(p);
    p.stacks[c.id] = (p.stacks[c.id] || 0) + 1;
    addText(p.x, p.y - 52, c.n, RCOLOR[c.r], 18, -30, 1);
    flash(0.22, '160,200,255');
    addShock(p.x, p.y, 120, RCOLOR[c.r], 0.45, 4);
    sfx.card();
    G.cards = [];
    G.state = 'playing';
    if (G.upgradeReason === 'wave') startWave(G.wave + 1);
    else p.inv = Math.max(p.inv, 0.8);
  }

  // ---------------------------------------------------------------- xp + level-up
  function gainXp(v) {
    var p = G.player;
    if (!p || p.dead) return;
    p.xp += v;
    while (p.xp >= p.xpNext) {
      p.xp -= p.xpNext;
      p.level++;
      p.xpNext = Math.round(p.xpNext * 1.3 + 6);
      G.pendingCards++;
      levelUpFx(p);
    }
  }

  function levelUpFx(p) {
    sfx.levelup();
    G.levelFx = 1.1;
    G.levelUpDelay = 0.6;
    G.slowmo = Math.max(G.slowmo, 0.35);
    flash(0.3, '255,220,120');
    addShock(p.x, p.y, 220, '#fbbf24', 0.6, 6);
    burst(p.x, p.y, 36, '#fde68a', 320, 4);
    addText(p.x, p.y - 58, 'LEVEL ' + p.level, '#fbbf24', 24, -26, 1);
  }

  function updateGems(dt) {
    var p = G.player;
    G.gemChainT -= dt;
    if (G.gemChainT <= 0) G.gemChain = 0;
    var vacuum = G.betweenWaves > 0;
    var reach = 120 * (p ? p.magnet : 1);
    for (var i = G.gems.length - 1; i >= 0; i--) {
      var g = G.gems[i];
      g.life -= dt;
      g.bob += dt * 4;
      if (g.life <= 0) { G.gems.splice(i, 1); continue; }
      if (p && !p.dead) {
        var dx = p.x - g.x, dy = p.y - g.y, dd = len(dx, dy) || 1;
        if (vacuum || dd < reach) g.pull = true;
        if (g.pull) {
          var acc = 1600 + (vacuum ? 1400 : 0);
          g.vx += dx / dd * acc * dt; g.vy += dy / dd * acc * dt;
          g.vx *= Math.pow(0.08, dt); g.vy *= Math.pow(0.08, dt);
          if (Math.random() < 0.3) addParticle(g.x, g.y, rand(-10, 10), rand(-10, 10), 0.22, gemColor(g.v), 2);
        } else {
          g.vx *= Math.pow(0.05, dt); g.vy *= Math.pow(0.05, dt);
        }
        if (dd < p.r + 8) {
          gainXp(g.v);
          sfx.gem(G.gemChain);
          G.gemChain++; G.gemChainT = 0.35;
          G.gems.splice(i, 1);
          continue;
        }
      }
      g.x += g.vx * dt; g.y += g.vy * dt;
    }
  }

  function drawGems() {
    ctx.save();
    for (var i = 0; i < G.gems.length; i++) {
      var g = G.gems[i];
      var col = gemColor(g.v);
      var s = (g.v >= 5 ? 6.5 : g.v >= 3 ? 5.2 : 4) * (1 + Math.sin(g.bob) * 0.12);
      if (g.life < 4 && Math.sin(G.time * 20) < 0) continue;
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(g.bob * 0.4);
      ctx.shadowColor = col; ctx.shadowBlur = 10;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, -s * 1.4); ctx.lineTo(s, 0); ctx.lineTo(0, s * 1.4); ctx.lineTo(-s, 0);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.moveTo(0, -s * 1.4); ctx.lineTo(s * 0.45, 0); ctx.lineTo(0, -s * 0.2); ctx.lineTo(-s * 0.45, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // two mutators picked from today's date, the same for everyone on that day
  function dailyMods() {
    var s = dayStamp(), h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var a = h % MUTATORS.length;
    var b = (a + 1 + ((h >>> 8) % (MUTATORS.length - 1))) % MUTATORS.length;
    return [MUTATORS[a].id, MUTATORS[b].id];
  }

  function selectedMods() {
    if (G.daily) return dailyMods();
    var out = [];
    for (var i = 0; i < MUTATORS.length; i++) if (G.mutSel[MUTATORS[i].id]) out.push(MUTATORS[i].id);
    return out;
  }

  function modsMul(mods) {
    var m = 1;
    for (var i = 0; i < MUTATORS.length; i++) if (mods.indexOf(MUTATORS[i].id) >= 0) m *= MUTATORS[i].mul;
    return Math.round(m * 100) / 100;
  }

  function modsKey(mods) {
    if (G.daily) return 'DAILY ' + dayStamp();
    return mods.length ? mods.slice().sort().join('+') : 'STANDARD';
  }

  function modOn(id) { return G.mods.indexOf(id) >= 0; }

  function toggleMutator(id) {
    initAudio();
    if (id === 'daily') { G.daily = !G.daily; sfx.toggle(G.daily); saveRecords(); return; }
    if (G.daily) { G.daily = false; }
    G.mutSel[id] = !G.mutSel[id];
    sfx.toggle(G.mutSel[id]);
    saveRecords();
  }

  function mutatorRects() {
    var items = MUTATORS.concat([{ id: 'daily', key: 't', n: 'DAILY', color: '#ffffff' }]);
    var cw = 138, ch = 26, gap = 8;
    var cols = clamp(Math.floor((W - 32 + gap) / (cw + gap)), 1, items.length);
    var rows = Math.ceil(items.length / cols);
    var y0 = G.mutY || H * 0.8;
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var r = Math.floor(i / cols), c = i % cols;
      var inRow = Math.min(cols, items.length - r * cols);
      var rowW = inRow * cw + (inRow - 1) * gap;
      out.push({ x: W / 2 - rowW / 2 + c * (cw + gap), y: y0 + r * (ch + gap), w: cw, h: ch, m: items[i] });
    }
    out.rows = rows;
    return out;
  }

  function mutatorHit(x, y) {
    var rects = mutatorRects();
    for (var i = 0; i < rects.length; i++) {
      var r = rects[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { toggleMutator(r.m.id); return true; }
    }
    return false;
  }

  function cardRects() {
    var n = G.cards.length;
    if (!n) return [];
    var cw = Math.min(250, (W - 80) / n - 18);
    var ch = Math.min(300, H * 0.46);
    var gap = 20;
    var totalW = n * cw + (n - 1) * gap;
    var x0 = W / 2 - totalW / 2;
    var y0 = H / 2 - ch / 2 + 20;
    var out = [];
    for (var i = 0; i < n; i++) out.push({ x: x0 + i * (cw + gap), y: y0, w: cw, h: ch, card: G.cards[i] });
    return out;
  }

  // ---------------------------------------------------------------- waves
  var COST = { grunt: 1, dodger: 1, shooter: 1.5, tank: 3, bomber: 1.6, sniper: 1.8, orbiter: 2, splitter: 2.4 };

  function startWave(n) {
    G.wave = n;
    G.spawnQueue = [];
    G.betweenWaves = 0;

    var unlockAt = [2, 4, 6];
    for (var u = 0; u < unlockAt.length; u++) {
      if (n === unlockAt[u]) {
        G.player.unlocked[u + 1] = true;
        G.player.weapon = u + 1;
        G.toast = 'WEAPON UNLOCKED  //  ' + WEAPONS[u + 1].name + '   [KEY ' + (u + 2) + ']';
        G.toastT = 4.5;
        sfx.unlock();
      }
    }
    if (G.player.shieldWave > 0 && n > 1) {
      G.player.shield = Math.max(G.player.shield, 7 * G.player.shieldWave);
    }

    if (n % 5 === 0) {
      G.waveBannerText = 'WARNING  //  BOSS INBOUND';
      G.waveBanner = 2.4;
      G.bannerFlash = 1;
      sfx.boss();
      shake(20);
      G.spawnQueue.push({ t: 1.6, type: 'boss' });
    } else {
      G.waveBannerText = 'WAVE ' + n;
      G.waveBanner = 1.6;
      sfx.wave();
      var budget = (3 + n * 2.1) * (modOn('horde') ? 1.5 : 1);
      var pool = ['grunt', 'grunt'];
      if (n >= 2) pool.push('dodger');
      if (n >= 3) pool.push('shooter');
      if (n >= 4) pool.push('tank', 'bomber');
      if (n >= 5) pool.push('sniper');
      if (n >= 6) pool.push('orbiter', 'splitter');
      if (n >= 9) pool.push('tank', 'orbiter', 'sniper', 'splitter');
      var t = 0;
      while (budget > 0) {
        var type = pick(pool);
        var cost = COST[type] || 1;
        if (cost > budget && budget > 1) { type = 'grunt'; cost = 1; }
        budget -= cost;
        G.spawnQueue.push({ t: t, type: type });
        t += rand(0.12, 0.42);
      }
    }
  }

  function updateWaves(dt) {
    for (var i = G.spawnQueue.length - 1; i >= 0; i--) {
      var s = G.spawnQueue[i];
      s.t -= dt;
      if (s.t <= 0) {
        var p = edgePoint();
        maybeElite(spawnEnemy(s.type, p.x, p.y));
        G.spawnQueue.splice(i, 1);
      }
    }
    if (G.spawnQueue.length === 0 && G.enemies.length === 0 && G.wave > 0) {
      if (G.betweenWaves === 0) {
        G.betweenWaves = 2.2;
        if (G.wave > 0) {
          addText(W / 2, H / 2 - 60, 'WAVE CLEAR', '#7dfcff', 30, -12);
          var bonus = Math.round(60 * G.wave * (G.combo > 1 ? 1.5 : 1) * G.scoreMul);
          G.score += bonus;
          addText(W / 2, H / 2 - 20, '+' + bonus, '#ffe066', 22, -20);
        }
      } else {
        G.betweenWaves -= dt;
        if (G.betweenWaves <= 0) openUpgrade('wave');
      }
    }
  }

  // ---------------------------------------------------------------- player powers
  function tryOverdrive() {
    var p = G.player;
    if (!p || p.odActive > 0 || !p.odReady) return;
    p.odReady = false;
    p.odCharge = 0;
    p.odActive = 7 + p.odBonus;
    sfx.overdrive();
    flash(0.5, '80,255,255');
    shake(16);
    addText(p.x, p.y - 40, 'OVERDRIVE', '#7dfcff', 26, -30);
    addRing(p.x, p.y, 260, '#7dfcff', 0.6, 6);
  }

  function selectWeapon(i) {
    var p = G.player;
    if (!p || !p.unlocked[i] || p.weapon === i) return;
    p.weapon = i;
    sfx.ui();
    addText(p.x, p.y - 34, WEAPONS[i].name, WEAPONS[i].color, 16, -30);
    addRing(p.x, p.y, 30, WEAPONS[i].color, 0.25, 2);
  }

  function dropPowerup(x, y, forced) {
    var roll = Math.random();
    if (!forced && (roll > 0.17 || modOn('nopick'))) return;
    var kinds = ['heal', 'heal', 'shield', 'spread', 'rapid', 'bomb'];
    var kind = forced || pick(kinds);
    G.drops.push({ x: x, y: y, vx: rand(-30, 30), vy: rand(-30, 30), kind: kind, life: 14, bob: rand(0, TAU), r: 13 });
  }

  function applyPowerup(kind) {
    var p = G.player;
    if (!p) return;
    sfx.power();
    flash(0.28, '120,255,200');
    if (kind === 'heal') { p.hp = Math.min(p.maxHp, p.hp + 35); addText(p.x, p.y - 30, '+35 HP', '#6ee7b7', 18); }
    else if (kind === 'shield') { p.shield = 9; addText(p.x, p.y - 30, 'SHIELD', '#60a5fa', 18); }
    else if (kind === 'spread') { p.spread = 13; addText(p.x, p.y - 30, 'SPREAD FIRE', '#fca5a5', 18); }
    else if (kind === 'rapid') { p.rapid = 11; addText(p.x, p.y - 30, 'RAPID FIRE', '#ffd166', 18); }
    else if (kind === 'bomb') {
      addText(p.x, p.y - 30, 'NUKE!', '#f87171', 24);
      shake(28); flash(0.7, '255,120,80');
      hitStop(0.08);
      G.aberr = Math.max(G.aberr, 0.5);
      addShock(p.x, p.y, Math.max(W, H), '#ffb020', 0.6, 10);
      for (var i = 0; i < G.enemies.length; i++) {
        var e = G.enemies[i];
        var d = dist(p.x, p.y, e.x, e.y);
        if (d < Math.max(W, H)) { damageEnemy(e, e.boss ? 220 : 9999, (e.x - p.x) / (d || 1), (e.y - p.y) / (d || 1)); }
      }
      for (var j = 0; j < G.ebullets.length; j++) G.ebullets[j].dead = true;
    }
  }

  // ---------------------------------------------------------------- damage
  function damageEnemy(e, dmg, kx, ky) {
    if (e.dead) return;
    if (e.eshield > 0) {
      var absorbed = Math.min(e.eshield, dmg);
      e.eshield -= absorbed;
      dmg -= absorbed;
      e.shieldRegenT = 3;
      if (e.eshield <= 0) {
        sfx.shieldBreak();
        addShock(e.x, e.y, e.r * 3, '#60a5fa', 0.35, 3);
        burst(e.x, e.y, 16, '#93c5fd', 240, 3);
      }
    }
    e.hp -= dmg;
    e.flash = 0.12;
    if (kx || ky) { e.vx += (kx || 0) * 40; e.vy += (ky || 0) * 40; }
    if (e.hp <= 0) killEnemy(e);
  }

  function killEnemy(e) {
    if (e.dead) return;
    e.dead = true;
    G.kills++;
    G.totalKills++;
    var ply = G.player;

    G.streak++;
    G.streakT = 2.6;
    var st = G.stats;
    if (st) {
      st.maxStreak = Math.max(st.maxStreak, G.streak);
      if (e.elite) st.elites++;
      if (e.boss) st.bosses++;
    }
    var labels = { 10: 'RAMPAGE', 20: 'UNSTOPPABLE', 35: 'MASSACRE', 50: 'GODLIKE', 75: 'ANNIHILATION', 100: 'LEGENDARY' };
    if (labels[G.streak]) {
      addText(ply ? ply.x : e.x, (ply ? ply.y : e.y) - 74, labels[G.streak], '#ffd166', 26, -24, 1);
      G.score += Math.round(G.streak * 10 * G.scoreMul);
      sfx.streak();
      flash(0.2, '255,209,102');
    }

    if (ply && ply.lifesteal > 0) {
      ply.hp = Math.min(ply.maxHp, ply.hp + ply.lifesteal);
      addText(e.x, e.y - 22, '+' + ply.lifesteal, '#6ee7b7', 12, -34);
    }

    var mult = G.combo * G.scoreMul;
    var gained = Math.round(e.score * mult);
    G.score += gained;
    G.scorePop = 1;
    addText(e.x, e.y, '+' + gained, '#fff', e.boss ? 26 : 14, -46);

    // xp shards + hull debris
    var xp = e.boss ? 120 : Math.max(1, Math.round(e.score / 6));
    var gemN = e.boss ? 24 : clamp(Math.ceil(xp / 4), 1, e.elite ? 6 : 3);
    var per = Math.max(1, Math.round(xp / gemN));
    for (var gi = 0; gi < gemN; gi++) dropGem(e.x + rand(-6, 6), e.y + rand(-6, 6), per);
    spawnShards(e);

    if (e.elite) {
      sfx.elite();
      hitStop(0.05);
      G.aberr = Math.max(G.aberr, 0.22);
      addShock(e.x, e.y, e.r * 4.5, '#fbbf24', 0.45, 5);
      burst(e.x, e.y, 30, '#fbbf24', 320, 4.5);
      addText(e.x, e.y - e.r - 22, 'ELITE DOWN', '#fbbf24', 17, -34, 1);
      dropPowerup(e.x, e.y, pick(['heal', 'shield', 'spread', 'rapid']));
      if (e.elite === 'VOLATILE') {
        addShock(e.x, e.y, 240, '#fb923c', 0.45, 7);
        burst(e.x, e.y, 40, '#fb923c', 420, 5);
        shake(12);
        if (ply && !ply.dead && dist(ply.x, ply.y, e.x, e.y) < 120) hurtPlayer(18);
      }
    }

    if (e.boss) {
      sfx.bigKill();
      shake(30); flash(0.75, '255,90,140'); hitStop(0.16); G.slowmo = 1.1;
      G.aberr = Math.max(G.aberr, 0.7);
      addShock(e.x, e.y, Math.max(W, H) * 0.7, e.color, 0.9, 10);
      for (var b = 0; b < 5; b++) {
        (function (b) {
          setTimeout(function () {
            burst(e.x + rand(-70, 70), e.y + rand(-70, 70), 60, pick(['#f43f5e', '#ffd166', '#ffffff']), 460, 6);
            addRing(e.x + rand(-70, 70), e.y + rand(-70, 70), 140, '#ffd166', 0.5, 5);
          }, b * 120);
        })(b);
      }
      for (var d = 0; d < 4; d++) dropPowerup(e.x + rand(-60, 60), e.y + rand(-60, 60), pick(['heal', 'shield', 'spread', 'rapid']));
      G.combo = Math.min(9, G.combo + 1);
    } else {
      sfx.kill();
      shake(e.type === 'tank' ? 9 : 4);
      burst(e.x, e.y, e.type === 'tank' ? 34 : 18, e.color, e.type === 'tank' ? 300 : 210, e.type === 'tank' ? 5 : 3.6);
      addRing(e.x, e.y, e.r * 2.2, e.color, 0.3, 2.5);
      dropPowerup(e.x, e.y);
      if (e.type === 'tank') {
        for (var k = 0; k < 3; k++) {
          var s = spawnEnemy('grunt', e.x + rand(-30, 30), e.y + rand(-30, 30));
          s.spawn = 0.2;
        }
      } else if (e.type === 'splitter') {
        for (var q = 0; q < 2; q++) {
          var s2 = spawnEnemy('dodger', e.x + rand(-26, 26), e.y + rand(-26, 26));
          s2.spawn = 0.15;
        }
      }
      G.combo = Math.min(9, G.combo + (e.type === 'tank' ? 0.5 : e.type === 'splitter' ? 0.4 : 0.2));
    }
    G.comboT = 2.6;
    if (st) st.maxCombo = Math.max(st.maxCombo, G.combo);
    if (ply && !ply.odActive) {
      var odGain = (e.boss ? 60 : e.type === 'tank' ? 12 : e.type === 'splitter' ? 10 : 5) * ply.odRate;
      ply.odCharge = Math.min(100, ply.odCharge + odGain);
      if (ply.odCharge >= 100 && !ply.odReady) {
        ply.odReady = true;
        addText(ply.x, ply.y - 46, 'OVERDRIVE READY  [Q]', '#7dfcff', 15, -26);
      }
    }
  }

  function bomberBlast(e) {
    e.dead = true;
    sfx.bigKill();
    shake(12);
    addShock(e.x, e.y, 130, '#fb7185', 0.4, 6);
    burst(e.x, e.y, 40, '#fb7185', 380, 5);
    spawnShards(e);
    var p = G.player;
    if (p && !p.dead && dist(p.x, p.y, e.x, e.y) < 130) hurtPlayer(24);
    // damage nearby enemies too
    for (var i = 0; i < G.enemies.length; i++) {
      var o = G.enemies[i];
      if (o === e || o.boss) continue;
      if (dist(o.x, o.y, e.x, e.y) < 130) damageEnemy(o, 40, (o.x - e.x) / 130, (o.y - e.y) / 130);
    }
  }

  function hurtPlayer(dmg, src) {
    var p = G.player;
    if (!p || p.inv > 0 || p.dashT > 0) return;
    if (p.shield > 0) {
      p.shield = 0;
      p.inv = 1.2;
      sfx.dash();
      addRing(p.x, p.y, 70, '#60a5fa', 0.4, 4);
      burst(p.x, p.y, 20, '#60a5fa', 200, 3.5);
      addText(p.x, p.y - 30, 'SHIELD DOWN', '#60a5fa', 15);
      return;
    }
    p.hp -= dmg;
    p.inv = 0.9;
    sfx.hurt();
    shake(14);
    flash(0.5, '255,60,90');
    G.aberr = Math.max(G.aberr, 0.4);
    if (src && src.elite === 'VAMPIRIC' && !src.dead) {
      src.hp = Math.min(src.maxHp, src.hp + src.maxHp * 0.2);
      addText(src.x, src.y - src.r - 12, '+DRAIN', '#f43f5e', 13, -30);
      burst(p.x, p.y, 10, '#f43f5e', 120, 3);
    }
    burst(p.x, p.y, 22, '#ff6b8a', 240, 4);
    G.combo = 1;
    G.streak = 0;
    if (p.thorns > 0) {
      addRing(p.x, p.y, 130, '#f97316', 0.35, 4);
      for (var i = 0; i < G.enemies.length; i++) {
        var e2 = G.enemies[i];
        if (e2.spawn > 0) continue;
        if (dist(p.x, p.y, e2.x, e2.y) < 130) damageEnemy(e2, p.thorns, (e2.x - p.x) / 130, (e2.y - p.y) / 130);
      }
    }
    if (p.hp <= 0) { p.hp = 0; p.dead = true; gameOver(); }
  }

  // ---------------------------------------------------------------- shooting
  var WEAPONS = [
    { name: 'PULSE',   color: '#7dfcff', rate: 0.115, dmg: 9 },
    { name: 'SCATTER', color: '#fca5a5', rate: 0.44,  dmg: 7 },
    { name: 'LANCE',   color: '#c4b5fd', rate: 0.52,  dmg: 30 },
    { name: 'SWARM',   color: '#fbbf24', rate: 0.58,  dmg: 8 }
  ];

  function fireBullet(x, y, ang, spd, dmg, opts) {
    opts = opts || {};
    var p = G.player;
    G.bullets.push({
      x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      r: opts.r || 4.5, dmg: dmg, life: opts.life || 1.15,
      color: opts.color || '#7dfcff',
      pierce: opts.pierce || 0, len: opts.len || 14,
      homing: opts.homing || 0, target: null,
      explosive: (p ? p.explosive : 0), ricochet: (p ? p.ricochet : 0),
      wi: (p ? p.weapon : 0),
      hit: [], dead: false
    });
    if (G.stats) G.stats.shots++;
  }

  function playerFire(p) {
    var ang = p.angle;
    var od = p.odActive > 0;
    var base = WEAPONS[p.weapon] || WEAPONS[0];
    var dmg = base.dmg * p.dmgMul;
    var tempProj = p.spread > 0 ? 2 : 0;
    var n = 1 + p.extraProj + tempProj;
    var i, t, off;
    if (p.weapon === 1) {
      var pellets = 5 + p.extraProj + tempProj;
      for (i = 0; i < pellets; i++) {
        t = pellets === 1 ? 0 : (i / (pellets - 1)) - 0.5;
        fireBullet(p.x + Math.cos(ang) * 16, p.y + Math.sin(ang) * 16, ang + t * 0.62, 720 + rand(-40, 40), dmg, { color: base.color, life: 0.6, len: 9, r: 4 });
      }
      sfx.shootBig();
    } else if (p.weapon === 2) {
      for (i = 0; i < n; i++) {
        off = (i - (n - 1) / 2) * 0.13;
        fireBullet(p.x + Math.cos(ang) * 18, p.y + Math.sin(ang) * 18, ang + off, 1500, dmg, { color: base.color, pierce: 2 + p.pierce, life: 1.0, len: 30, r: 5 });
      }
      sfx.laser();
      shake(2.4);
    } else if (p.weapon === 3) {
      var missiles = 1 + p.extraProj + tempProj + (od ? 1 : 0);
      for (i = 0; i < missiles; i++) {
        var a2 = ang + (i - (missiles - 1) / 2) * 0.3 + rand(-0.08, 0.08);
        fireBullet(p.x + Math.cos(ang) * 12, p.y + Math.sin(ang) * 12, a2, 420, dmg, { color: base.color, homing: 5.5, life: 2.2, len: 10, r: 5 });
      }
      sfx.missile();
    } else {
      for (i = 0; i < n; i++) {
        off = (i - (n - 1) / 2) * 0.09;
        fireBullet(p.x + Math.cos(ang) * 16, p.y + Math.sin(ang) * 16, ang + off + rand(-0.015, 0.015), 900, dmg, { color: base.color, pierce: p.pierce });
      }
      if (od) {
        fireBullet(p.x + Math.cos(ang + 0.12) * 14, p.y + Math.sin(ang + 0.12) * 14, ang + 0.13, 860, dmg, { color: base.color, pierce: p.pierce });
        fireBullet(p.x + Math.cos(ang - 0.12) * 14, p.y + Math.sin(ang - 0.12) * 14, ang - 0.13, 860, dmg, { color: base.color, pierce: p.pierce });
      }
      sfx.shoot();
    }
    p.recoil = 1;
    burst(p.x + Math.cos(ang) * 18, p.y + Math.sin(ang) * 18, 3, '#9ff8ff', 90, 2.2);
  }

  function enemyFire(e, ang, spd, dmg, color, r) {
    G.ebullets.push({
      x: e.x + Math.cos(ang) * (e.r + 6), y: e.y + Math.sin(ang) * (e.r + 6),
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      r: r || 6, dmg: dmg || 10, life: 5, color: color || '#ff8fa3', dead: false, owner: e
    });
  }

  function explodeAt(x, y, radius, dmg) {
    addShock(x, y, radius * 2, '#fdba74', 0.24, 3);
    burst(x, y, 9, '#fdba74', 220, 3);
    for (var i = 0; i < G.enemies.length; i++) {
      var e = G.enemies[i];
      if (e.dead || e.spawn > 0) continue;
      if (dist(x, y, e.x, e.y) < radius + e.r) damageEnemy(e, dmg, (e.x - x) / radius, (e.y - y) / radius);
    }
  }

  // ---------------------------------------------------------------- mines
  function placeMine() {
    var p = G.player;
    if (!p || p.dead || p.mines <= 0) return;
    p.mines--;
    G.mines.push({ x: p.x, y: p.y, r: 12, arm: 0.35, life: 26, bob: Math.random() * TAU });
    sfx.mine();
    addRing(p.x, p.y, 34, '#fbbf24', 0.25, 2);
  }

  function updateMines(dt) {
    var p = G.player;
    if (p) {
      if (p.mines < p.mineMax) {
        p.mineTimer -= dt;
        if (p.mineTimer <= 0) { p.mines++; p.mineTimer = p.mineRecharge; }
      } else {
        p.mineTimer = p.mineRecharge;
      }
    }
    for (var i = G.mines.length - 1; i >= 0; i--) {
      var m = G.mines[i];
      m.bob += dt * 4;
      m.arm -= dt;
      m.life -= dt;
      if (m.life <= 0) { G.mines.splice(i, 1); continue; }
      if (m.arm > 0) continue;
      var trig = false;
      for (var j = 0; j < G.enemies.length; j++) {
        var e = G.enemies[j];
        if (e.dead || e.spawn > 0) continue;
        if (dist(m.x, m.y, e.x, e.y) < 52 + e.r) { trig = true; break; }
      }
      if (trig) {
        G.mines.splice(i, 1);
        sfx.bigKill();
        shake(8);
        addShock(m.x, m.y, 190, '#fbbf24', 0.4, 6);
        burst(m.x, m.y, 34, '#fbbf24', 360, 5);
        for (var k = 0; k < G.enemies.length; k++) {
          var e2 = G.enemies[k];
          if (e2.dead || e2.spawn > 0) continue;
          if (dist(m.x, m.y, e2.x, e2.y) < 150) damageEnemy(e2, 120, (e2.x - m.x) / 150, (e2.y - m.y) / 150);
        }
      }
    }
  }

  function drawMines() {
    for (var i = 0; i < G.mines.length; i++) {
      var m = G.mines[i];
      var armed = m.arm <= 0;
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.globalAlpha = armed ? 1 : 0.45;
      ctx.rotate(m.bob);
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = armed ? 16 : 6;
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.2;
      poly(ctx, 0, 0, m.r, 6, 0);
      ctx.stroke();
      poly(ctx, 0, 0, m.r * 0.45, 6, Math.PI / 6);
      ctx.fillStyle = armed ? '#fbbf24' : 'rgba(251,191,36,0.4)';
      ctx.fill();
      ctx.restore();
      if (armed) {
        ctx.save();
        ctx.globalAlpha = 0.10 + 0.05 * Math.sin(m.bob * 2);
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(m.x, m.y, 52, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // ---------------------------------------------------------------- enemy AI
  function updateEnemy(e, dt) {
    var p = G.player;
    if (!p) return;
    var ts = (p.odActive > 0 ? 0.5 : 1) * p.enemySlow;
    var edt = dt * ts;
    e.flash = Math.max(0, e.flash - dt);
    if (e.spawn > 0) { e.spawn -= dt; return; }

    if (modOn('hell')) e.fireCd -= edt * 0.6;
    if (e.eshieldMax) {
      if (e.shieldRegenT > 0) e.shieldRegenT -= dt;
      else e.eshield = Math.min(e.eshieldMax, e.eshield + e.eshieldMax * 0.15 * dt);
    }
    if (e.elite === 'HASTE' && Math.random() < 0.5) {
      addParticle(e.x + rand(-4, 4), e.y + rand(-4, 4), -e.vx * 0.2, -e.vy * 0.2, 0.3, '#facc15', 3);
    }

    var dx = p.x - e.x, dy = p.y - e.y;
    var d = len(dx, dy) || 1;
    var nx = dx / d, ny = dy / d;
    e.angle = Math.atan2(dy, dx);
    steerBank(e, e.angle, dt);

    if (e.type === 'grunt') {
      e.wob += edt * 4;
      var wob = Math.sin(e.wob) * 0.35;
      e.vx = lerp(e.vx, (nx + -ny * wob) * e.spd, 0.10);
      e.vy = lerp(e.vy, (ny + nx * wob) * e.spd, 0.10);
    } else if (e.type === 'dodger') {
      e.stateT -= edt;
      if (e.stateT <= 0) { e.stateT = rand(0.7, 1.4); e.state = Math.random() < 0.5 ? 1 : 0; }
      var want = e.state === 1 ? 1 : -1;
      var tx = -ny * want, ty = nx * want;
      e.vx = lerp(e.vx, (nx * 0.8 + tx * 0.9) * e.spd, 0.10);
      e.vy = lerp(e.vy, (ny * 0.8 + ty * 0.9) * e.spd, 0.10);
    } else if (e.type === 'shooter') {
      var ideal = 280;
      var push = d < ideal ? -1 : (d > ideal + 90 ? 1 : 0);
      e.vx = lerp(e.vx, (nx * push + -ny * 0.25) * e.spd, 0.10);
      e.vy = lerp(e.vy, (ny * push + nx * 0.25) * e.spd, 0.10);
      e.fireCd -= edt;
      if (e.fireCd <= 0 && d < 620) {
        e.fireCd = rand(1.3, 2.1) / (1 + G.wave * 0.05);
        enemyFire(e, e.angle, 300, 9, '#ffd166', 6);
        tone(420, 0.08, 'square', 0.05, 200);
      }
    } else if (e.type === 'tank') {
      e.vx = lerp(e.vx, nx * e.spd, 0.10);
      e.vy = lerp(e.vy, ny * e.spd, 0.10);
      e.fireCd -= edt;
      if (e.fireCd <= 0 && d < 520) {
        e.fireCd = rand(2.0, 3.0);
        for (var i = 0; i < 6; i++) enemyFire(e, e.angle + (i - 2.5) * 0.3, 250, 10, '#c4b5fd', 7);
        tone(260, 0.12, 'square', 0.06, 120);
      }
    } else if (e.type === 'bomber') {
      e.vx = lerp(e.vx, nx * e.spd, 0.10);
      e.vy = lerp(e.vy, ny * e.spd, 0.10);
      if (e.fuse === undefined && d < e.r + p.r + 24) {
        e.fuse = 0.5;
        tone(760, 0.05, 'square', 0.07);
      }
      if (e.fuse !== undefined) {
        e.fuse -= edt;
        e.vx *= 0.86; e.vy *= 0.86;
        if (Math.random() < 0.5) addParticle(e.x + rand(-9, 9), e.y + rand(-9, 9), rand(-30, 30), rand(-30, 30), 0.25, '#fb7185', 4);
        if (e.fuse <= 0) { bomberBlast(e); return; }
      }
    } else if (e.type === 'sniper') {
      var idealS = 380;
      var pushS = d < idealS ? -1 : (d > idealS + 120 ? 1 : 0);
      e.vx = lerp(e.vx, (nx * pushS + -ny * 0.3) * e.spd, 0.10);
      e.vy = lerp(e.vy, (ny * pushS + nx * 0.3) * e.spd, 0.10);
      e.fireCd -= edt;
      if (e.charge > 0) {
        e.charge -= edt;
        if (e.charge <= 0) {
          enemyFire(e, e.angle, 840, 14, '#f0abfc', 5);
          tone(1100, 0.1, 'sawtooth', 0.06, 320);
          e.fireCd = rand(2.2, 3.2);
        }
      } else if (e.fireCd <= 0 && d < 700) {
        e.charge = 0.7;
        tone(300, 0.5, 'sine', 0.035, 900);
      }
    } else if (e.type === 'orbiter') {
      var R = 210;
      e.vx = lerp(e.vx, (-ny * 0.9 + nx * clamp((d - R) / 120, -1, 1)) * e.spd, 0.10);
      e.vy = lerp(e.vy, (nx * 0.9 + ny * clamp((d - R) / 120, -1, 1)) * e.spd, 0.10);
      e.fireCd -= edt;
      if (e.fireCd <= 0 && d < 620) {
        e.fireCd = rand(1.4, 2.0);
        enemyFire(e, e.angle, 340, 9, '#4ade80', 6);
        tone(500, 0.07, 'triangle', 0.035, 250);
      }
    } else if (e.type === 'splitter') {
      e.vx = lerp(e.vx, nx * e.spd, 0.10);
      e.vy = lerp(e.vy, ny * e.spd, 0.10);
      e.fireCd -= edt;
      if (e.fireCd <= 0 && d < 520) {
        e.fireCd = rand(1.8, 2.6);
        for (var si = -1; si <= 1; si++) enemyFire(e, e.angle + si * 0.22, 300, 9, '#38bdf8', 6);
        tone(360, 0.09, 'square', 0.05, 150);
      }
    } else if (e.type === 'boss') {
      updateBoss(e, edt, nx, ny, d);
    }

    e.x += e.vx * edt;
    e.y += e.vy * edt;
    e.vx *= 0.98;
    e.vy *= 0.98;

    var pad = e.r + 10;
    if (e.x < pad) { e.x = pad; e.vx = Math.abs(e.vx) * 0.5; }
    if (e.x > W - pad) { e.x = W - pad; e.vx = -Math.abs(e.vx) * 0.5; }
    if (e.y < pad) { e.y = pad; e.vy = Math.abs(e.vy) * 0.5; }
    if (e.y > H - pad) { e.y = H - pad; e.vy = -Math.abs(e.vy) * 0.5; }

    // separation so they don't stack up
    if (!e.boss && G.enemies.length < 90) {
      for (var j = 0; j < G.enemies.length; j++) {
        var o = G.enemies[j];
        if (o === e || o.boss) continue;
        var ox = e.x - o.x, oy = e.y - o.y;
        var od = len(ox, oy);
        var mind = e.r + o.r;
        if (od > 0.01 && od < mind) {
          var f = (mind - od) / mind;
          e.vx += (ox / od) * f * 60;
          e.vy += (oy / od) * f * 60;
        }
      }
    }
  }

  function updateBoss(e, dt, nx, ny, d) {
    var p = G.player;
    if (!e.seq) e.seq = [0, 1, 2, 3];
    e.stateT -= dt;
    if (e.stateT <= 0) {
      e.state = (e.state + 1) % e.seq.length;
      e.stateT = e.state === 0 ? 2.8 : 2.3;
      e.spin = 0;
    }
    var pat = e.seq[e.state];
    var rage = 1 + (1 - e.hp / e.maxHp) * 1.25;

    if (pat !== 4) {
      var cx = W / 2, cy = H * 0.36;
      e.wob += dt;
      var tx = cx + Math.cos(e.wob * 0.5) * Math.min(W * 0.28, 340);
      var ty = cy + Math.sin(e.wob * 0.7) * Math.min(H * 0.18, 140);
      e.vx = lerp(e.vx, (tx - e.x) * 1.1, 0.07);
      e.vy = lerp(e.vy, (ty - e.y) * 1.1, 0.07);
    }

    if (pat === 0) {
      e.fireCd -= dt;
      if (e.fireCd <= 0) {
        e.fireCd = 0.55 / rage;
        for (var i = -2; i <= 2; i++) enemyFire(e, e.angle + i * 0.16, 320, 12, '#ff8fa3', 7);
        tone(220, 0.1, 'sawtooth', 0.06, 90);
      }
    } else if (pat === 1) {
      e.fireCd -= dt;
      if (e.fireCd <= 0) {
        e.fireCd = 0.85 / rage;
        var n = 14 + G.bossNum * 2;
        var off = Math.random() * TAU;
        for (var k = 0; k < n; k++) enemyFire(e, off + k * TAU / n, 230, 12, '#ffd166', 7);
        tone(160, 0.16, 'square', 0.07, 70);
        shake(4);
      }
    } else if (pat === 2) {
      e.spin += dt * 4.4 * rage;
      e.fireCd -= dt;
      if (e.fireCd <= 0) {
        e.fireCd = 0.075;
        for (var s = 0; s < 3; s++) enemyFire(e, e.spin + s * TAU / 3, 200, 10, e.color, 6);
      }
    } else if (pat === 3) {
      e.fireCd -= dt;
      if (e.fireCd <= 0) {
        e.fireCd = 1.5 / rage;
        var count = 2 + G.bossNum;
        for (var m = 0; m < count; m++) {
          var mp = edgePoint();
          var mt = Math.random() < 0.5 ? 'grunt' : (Math.random() < 0.5 ? 'dodger' : 'bomber');
          spawnEnemy(mt, mp.x, mp.y);
        }
        tone(120, 0.3, 'sawtooth', 0.1, 300);
      }
    } else {
      e.fireCd -= dt;
      if (e.fireCd <= 0) {
        e.fireCd = 1.0 / rage;
        var la = Math.atan2(p.y - e.y, p.x - e.x);
        e.vx = Math.cos(la) * 620;
        e.vy = Math.sin(la) * 620;
        addRing(e.x, e.y, 110, e.color, 0.3, 4);
        tone(120, 0.25, 'sawtooth', 0.09, 400);
        var n2 = 10;
        for (var q2 = 0; q2 < n2; q2++) enemyFire(e, q2 * TAU / n2 + Math.random(), 240, 12, '#ffd166', 7);
        shake(6);
      }
    }
  }

  // ---------------------------------------------------------------- update
  function playerInputVector() {
    var ix = 0, iy = 0;
    // keys are stored lowercased, so arrows arrive as 'arrowleft' etc.
    if (keys['a'] || keys['arrowleft']) ix -= 1;
    if (keys['d'] || keys['arrowright']) ix += 1;
    if (keys['w'] || keys['arrowup']) iy -= 1;
    if (keys['s'] || keys['arrowdown']) iy += 1;
    if (touch.moveId !== null) { ix += touch.mvx; iy += touch.mvy; }
    var l = len(ix, iy);
    if (l > 1) { ix /= l; iy /= l; }
    return { x: ix, y: iy, l: Math.min(l, 1) };
  }

  // ---- banking: lean into turns, drawing-only
  function steerBank(o, newAngle, dt) {
    if (o.prevAngle !== undefined && dt > 0) { // dt 0 would make bank NaN
      var da = newAngle - o.prevAngle;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      o.bank = lerp(o.bank || 0, clamp(da / dt * 0.12, -1, 1), Math.min(1, dt * 8));
    }
    o.prevAngle = newAngle;
  }

  function updatePlayer(dt) {
    var p = G.player;
    if (!p) return;
    p.inv = Math.max(0, p.inv - dt);
    p.rapid = Math.max(0, p.rapid - dt);
    p.spread = Math.max(0, p.spread - dt);
    p.shield = Math.max(0, p.shield - dt);
    p.recoil = Math.max(0, p.recoil - dt * 6);
    if (p.regen > 0 && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
    if (p.dashCharges < p.dashMax) {
      p.dashTimer -= dt * (p.odActive > 0 ? 2.2 : 1);
      if (p.dashTimer <= 0) { p.dashCharges++; p.dashTimer = p.dashRecharge; }
    } else {
      p.dashTimer = p.dashRecharge;
    }
    if (p.odActive > 0) {
      p.odActive -= dt;
      if (p.odActive <= 0) { p.odActive = 0; addText(p.x, p.y - 30, 'OVERDRIVE END', '#7dfcff', 15); }
    }

    var inp = playerInputVector();

    // aim
    var aimAng = p.angle;
    if (touch.aimId !== null) {
      aimAng = Math.atan2(touch.avy, touch.avx);
    } else if (mouse.active) {
      aimAng = Math.atan2(mouse.y - p.y, mouse.x - p.x);
    } else if (inp.l > 0.1) {
      aimAng = Math.atan2(inp.y, inp.x);
    }
    // auto-aim toward nearest enemy when using touch, for feel
    if (touch.aimId === null && !mouse.active) {
      var best = null, bd = 1e9;
      for (var i = 0; i < G.enemies.length; i++) {
        var e = G.enemies[i];
        var d = dist(p.x, p.y, e.x, e.y);
        if (d < bd) { bd = d; best = e; }
      }
      if (best && bd < 460) aimAng = Math.atan2(best.y - p.y, best.x - p.x);
    }
    var da = aimAng - p.angle;
    while (da > Math.PI) da -= TAU;
    while (da < -Math.PI) da += TAU;
    p.angle += da * Math.min(1, dt * 18);
    steerBank(p, p.angle, dt);

    // dash (charge based, latched to one per press)
    var held = !!keys[' '];
    // a queued press is always a fresh press, even if the old latch never saw the release
    var wantDash = dashQueued || (held && !p.dashLatch);
    dashQueued = false;
    if (wantDash && p.dashCharges > 0 && p.dashT <= 0) {
      var dirx = inp.x, diry = inp.y;
      if (len(dirx, diry) < 0.1) { dirx = Math.cos(p.angle); diry = Math.sin(p.angle); }
      var dl = len(dirx, diry) || 1;
      p.dashVX = dirx / dl * 1150;
      p.dashVY = diry / dl * 1150;
      p.dashT = 0.17;
      p.dashCharges--;
      p.dashTimer = p.dashRecharge;
      sfx.dash();
      addRing(p.x, p.y, 42, '#7dfcff', 0.3, 3);
    }
    p.dashLatch = held;

    var accel = 3400 * p.spdMul, maxSpd = 340 * p.spdMul;
    if (p.dashT > 0) {
      p.dashT -= dt;
      p.x += p.dashVX * dt;
      p.y += p.dashVY * dt;
      if (Math.random() < 0.8) addParticle(p.x, p.y, rand(-40, 40), rand(-40, 40), 0.35, '#7dfcff', 6);
      G.ghosts.push({ x: p.x, y: p.y, a: p.angle, life: 0.28, max: 0.28 });
    } else {
      p.vx += inp.x * accel * dt;
      p.vy += inp.y * accel * dt;
      var fr = Math.pow(0.0008, dt);
      p.vx *= fr; p.vy *= fr;
      var sp = len(p.vx, p.vy);
      if (sp > maxSpd) { p.vx = p.vx / sp * maxSpd; p.vy = p.vy / sp * maxSpd; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.thrust = inp.l;
    }

    p.x = clamp(p.x, p.r, W - p.r);
    p.y = clamp(p.y, p.r, H - p.r);

    // contrail: wing-tip points, aged in updateFx
    if (len(p.vx, p.vy) > 40) {
      var ca = Math.cos(p.angle), sa = Math.sin(p.angle);
      for (var cs = -1; cs <= 1; cs += 2) {
        var lx = -p.r * 0.4, ly = cs * p.r * 0.95;
        G.contrail.push({ x: p.x + lx * ca - ly * sa, y: p.y + lx * sa + ly * ca, life: 0.5 });
      }
      if (G.contrail.length > 60) G.contrail.splice(0, G.contrail.length - 60);
    }

    // fire
    p.fireCd -= dt;
    var firing = mouse.down || keys['f'] || touch.aimId !== null;
    var baseW = WEAPONS[p.weapon] || WEAPONS[0];
    var rate = baseW.rate / p.rateMul;
    if (p.rapid > 0 || p.odActive > 0) rate *= 0.55;
    if (firing && p.fireCd <= 0 && !p.dead) {
      p.fireCd = rate;
      playerFire(p);
      if (p.recoil < 0.2) shake(1.1);
    }
  }

  function updateBullets(dt) {
    var i, b;
    for (i = G.bullets.length - 1; i >= 0; i--) {
      b = G.bullets[i];

      if (b.homing > 0) {
        if (!b.target || b.target.dead) {
          var hb = null, hbd = 1e9;
          for (var hq = 0; hq < G.enemies.length; hq++) {
            var he = G.enemies[hq];
            if (he.dead || he.spawn > 0) continue;
            var hd = dist(b.x, b.y, he.x, he.y);
            if (hd < hbd) { hbd = hd; hb = he; }
          }
          b.target = hb;
        }
        if (b.target) {
          var tAng = Math.atan2(b.target.y - b.y, b.target.x - b.x);
          var cAng = Math.atan2(b.vy, b.vx);
          var dAng = tAng - cAng;
          while (dAng > Math.PI) dAng -= TAU;
          while (dAng < -Math.PI) dAng += TAU;
          var nAng = cAng + clamp(dAng, -b.homing * dt, b.homing * dt);
          var bSp = len(b.vx, b.vy);
          b.vx = Math.cos(nAng) * bSp;
          b.vy = Math.sin(nAng) * bSp;
        }
        if (Math.random() < 0.7) addParticle(b.x, b.y, rand(-16, 16), rand(-16, 16), 0.28, b.color, 3);
      }

      b.x += b.vx * dt; b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x < -60 || b.x > W + 60 || b.y < -60 || b.y > H + 60) { G.bullets.splice(i, 1); continue; }

      for (var j = 0; j < G.enemies.length; j++) {
        var e = G.enemies[j];
        if (e.dead || e.spawn > 0) continue;
        if (b.hit.indexOf(e) >= 0) continue;
        if (dist(b.x, b.y, e.x, e.y) < e.r + b.r) {
          var pl = G.player;
          var isCrit = Math.random() < (pl ? pl.crit : 0);
          var dmg = b.dmg * (isCrit ? (pl ? pl.critMul : 2) : 1);
          damageEnemy(e, dmg, b.vx / 900, b.vy / 900);
          var st = G.stats;
          if (st) {
            st.hits++;
            st.dmg[b.wi] += dmg;
            if (isCrit) st.bigCrit = Math.max(st.bigCrit, dmg);
          }
          if (isCrit) {
            addText(e.x, e.y - e.r - 10, Math.round(dmg) + '!', '#ffd166', 17, -40, 1);
          } else if (e.dnum && e.dnum.life > 0.62 && G.texts.indexOf(e.dnum) >= 0) {
            // merge rapid hits into one rolling number per enemy
            e.dnum.val += dmg;
            e.dnum.t = String(Math.round(e.dnum.val));
            e.dnum.pop = 0.6;
            e.dnum.x = e.x; e.dnum.life = e.dnum.max;
          } else {
            e.dnum = addText(e.x + rand(-6, 6), e.y - e.r - 6, String(Math.round(dmg)), 'rgba(255,255,255,0.85)', 11, -50, 0.4);
            e.dnum.val = dmg;
          }
          burst(b.x, b.y, isCrit ? 10 : 5, isCrit ? '#ffd166' : '#ffffff', isCrit ? 260 : 160, 2.4);
          var ba = Math.atan2(-b.vy, -b.vx);
          for (var sk = 0; sk < (isCrit ? 5 : 3); sk++) {
            var sa = ba + rand(-0.9, 0.9), ss = rand(240, 520);
            addSpark(b.x, b.y, Math.cos(sa) * ss, Math.sin(sa) * ss, rand(0.12, 0.25), isCrit ? '#ffd166' : b.color, 1.6);
          }
          sfx.hit();

          if (b.explosive > 0) explodeAt(b.x, b.y, 60, 13 * b.explosive);

          if (b.pierce > 0) {
            b.pierce--;
            b.hit.push(e);
            b.dmg *= 0.92;
          } else if (b.ricochet > 0) {
            b.ricochet--;
            b.hit.push(e);
            var nt = null, nd = 1e9;
            for (var rq = 0; rq < G.enemies.length; rq++) {
              var re = G.enemies[rq];
              if (re === e || re.dead || re.spawn > 0 || b.hit.indexOf(re) >= 0) continue;
              var rd = dist(b.x, b.y, re.x, re.y);
              if (rd < nd && rd < 340) { nd = rd; nt = re; }
            }
            if (nt) {
              var rA = Math.atan2(nt.y - b.y, nt.x - b.x);
              var rSp = len(b.vx, b.vy);
              b.vx = Math.cos(rA) * rSp; b.vy = Math.sin(rA) * rSp;
              b.life = Math.max(b.life, 0.6);
            } else { G.bullets.splice(i, 1); }
          } else {
            G.bullets.splice(i, 1);
          }
          break;
        }
      }
    }

    for (i = G.ebullets.length - 1; i >= 0; i--) {
      b = G.ebullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x < -60 || b.x > W + 60 || b.y < -60 || b.y > H + 60) { G.ebullets.splice(i, 1); continue; }
      var p = G.player;
      if (p && !p.dead && dist(b.x, b.y, p.x, p.y) < p.r + b.r) {
        hurtPlayer(b.dmg, b.owner);
        burst(b.x, b.y, 8, b.color, 180, 3);
        G.ebullets.splice(i, 1);
      }
    }
  }

  function updateDrops(dt) {
    var p = G.player;
    for (var i = G.drops.length - 1; i >= 0; i--) {
      var d = G.drops[i];
      d.life -= dt;
      d.bob += dt * 5;
      // magnet
      if (p && !p.dead) {
        var dx = p.x - d.x, dy = p.y - d.y;
        var dd = len(dx, dy);
        if (dd < 150 * p.magnet) { d.vx += dx / dd * 420 * dt; d.vy += dy / dd * 420 * dt; }
      }
      d.vx *= Math.pow(0.2, dt); d.vy *= Math.pow(0.2, dt);
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.x = clamp(d.x, 16, W - 16); d.y = clamp(d.y, 16, H - 16);
      if (d.life <= 0) { G.drops.splice(i, 1); continue; }
      if (p && !p.dead && dist(d.x, d.y, p.x, p.y) < p.r + d.r + 6) {
        applyPowerup(d.kind);
        G.drops.splice(i, 1);
      }
    }
  }

  function updateFx(dt) {
    var i;
    for (i = G.parts.length - 1; i >= 0; i--) {
      var q = G.parts[i];
      q.life -= dt;
      if (q.life <= 0) { G.parts.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vx *= Math.pow(0.12, dt); q.vy *= Math.pow(0.12, dt);
    }
    for (i = G.contrail.length - 1; i >= 0; i--) {
      G.contrail[i].life -= dt;
      if (G.contrail[i].life <= 0) G.contrail.splice(i, 1);
    }
    for (i = G.rings.length - 1; i >= 0; i--) {
      var r = G.rings[i];
      r.life -= dt;
      if (r.life <= 0) G.rings.splice(i, 1);
    }
    for (i = G.texts.length - 1; i >= 0; i--) {
      var t = G.texts[i];
      t.life -= dt;
      t.y += t.vy * dt;
      t.vy *= Math.pow(0.25, dt);
      if (t.life <= 0) G.texts.splice(i, 1);
    }
    for (i = G.ghosts.length - 1; i >= 0; i--) {
      var g = G.ghosts[i];
      g.life -= dt;
      if (g.life <= 0) G.ghosts.splice(i, 1);
    }
    for (i = G.shards.length - 1; i >= 0; i--) {
      var sh = G.shards[i];
      sh.life -= dt;
      if (sh.life <= 0) { G.shards.splice(i, 1); continue; }
      sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      sh.vx *= Math.pow(0.05, dt); sh.vy *= Math.pow(0.05, dt);
      sh.rot += sh.vr * dt;
    }
    for (i = 0; i < G.texts.length; i++) if (G.texts[i].pop > 0) G.texts[i].pop = Math.max(0, G.texts[i].pop - dt * 4);
    G.scorePop = Math.max(0, G.scorePop - dt * 3);
    if (G.scoreShown < G.score) G.scoreShown = Math.min(G.score, G.scoreShown + Math.max(1, (G.score - G.scoreShown) * dt * 9));
    else G.scoreShown = G.score;
    G.levelFx = Math.max(0, G.levelFx - dt);
    G.aberr = Math.max(0, G.aberr - dt * 1.6);
    G.heartPulse = Math.max(0, (G.heartPulse || 0) - dt * 3.5);
    G.shake *= Math.pow(0.0025, dt);
    if (G.shake < 0.2) G.shake = 0;
    G.flash = Math.max(0, G.flash - dt * 2.6);
    G.comboT -= dt;
    if (G.comboT <= 0) { G.combo = Math.max(1, G.combo - dt * 2.2); if (G.combo < 1.02) G.combo = 1; }
    G.streakT -= dt;
    if (G.streakT <= 0) G.streak = 0;
    if (G.toastT > 0) G.toastT -= dt;
    if (G.waveBanner > 0) G.waveBanner -= dt;
    if (G.bannerFlash > 0) G.bannerFlash -= dt * 1.6;

    var sx = (Math.random() - 0.5) * G.shake;
    var sy = (Math.random() - 0.5) * G.shake;
    G.shakeX = sx; G.shakeY = sy;
  }

  function update(dt) {
    G.time += dt;
    updateWaves(dt);
    updatePlayer(dt);
    var ts = (G.player && G.player.odActive > 0 ? 0.5 : 1);
    for (var i = 0; i < G.enemies.length; i++) {
      if (!G.enemies[i].dead) updateEnemy(G.enemies[i], dt);
    }
    updateBullets(dt);
    updateMines(dt);
    updateDrops(dt);
    updateGems(dt);
    updateFx(dt);
    var p = G.player;
    if (G.stats && p && !p.dead) G.stats.time += dt;

    // level-up: let the burst play, then open the card pick
    if (G.levelUpDelay > 0) G.levelUpDelay -= dt;
    if (G.pendingCards > 0 && G.levelUpDelay <= 0 && G.state === 'playing' && p && !p.dead) {
      G.pendingCards--;
      openUpgrade('level');
    }

    // heartbeat when hull is critical
    if (p && !p.dead && p.hp / p.maxHp < 0.28) {
      G.heartT -= dt;
      if (G.heartT <= 0) { sfx.heart(); G.heartPulse = 1; G.heartT = 0.4 + 0.6 * (p.hp / p.maxHp) / 0.28; }
    } else {
      G.heartT = 0;
    }

    // collision player <-> enemy
    if (p && !p.dead) {
      for (var j = 0; j < G.enemies.length; j++) {
        var e = G.enemies[j];
        if (e.dead || e.spawn > 0) continue;
        if (dist(p.x, p.y, e.x, e.y) < p.r + e.r) {
          hurtPlayer(e.boss ? 26 : 12, e);
          var ax = p.x - e.x, ay = p.y - e.y, al = len(ax, ay) || 1;
          p.vx += ax / al * 380; p.vy += ay / al * 380;
          if (!e.boss) { e.vx -= ax / al * 200; e.vy -= ay / al * 200; }
        }
      }
    }
    // cull
    for (var k = G.enemies.length - 1; k >= 0; k--) if (G.enemies[k].dead) G.enemies.splice(k, 1);
  }

  // ---------------------------------------------------------------- rendering
  function drawBackground() {
    var t = G.time;
    var od = G.player && G.player.odActive > 0;

    var g = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.5, Math.max(W, H) * 0.78);
    if (od) {
      g.addColorStop(0, '#0b3242');
      g.addColorStop(0.5, '#06151f');
      g.addColorStop(1, '#03050b');
    } else {
      g.addColorStop(0, '#0b1020');
      g.addColorStop(0.5, '#070a14');
      g.addColorStop(1, '#03040a');
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // drifting nebulae (deepest layer)
    for (var n = 0; n < NEBS.length; n++) {
      var nb = NEBS[n];
      var nx = wrapNum(nb.x * W + t * nb.vx, W + 700) - 350;
      var ny = wrapNum(nb.y * H + t * nb.vy, H + 700) - 350;
      var nr = nb.r * Math.min(W, H);
      var ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
      ng.addColorStop(0, withAlpha(nb.c, nb.a));
      ng.addColorStop(1, withAlpha(nb.c, 0));
      ctx.fillStyle = ng;
      ctx.fillRect(nx - nr, ny - nr, nr * 2, nr * 2);
    }

    // parallax starfield: closer stars drift faster and shift more with the player
    var px = G.player ? G.player.x : W / 2;
    var py = G.player ? G.player.y : H / 2;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += (s.s / 60) * 0.28;
      if (s.y > H + 6) { s.y = -6; s.x = Math.random() * W; }
      var par = 0.024 * s.z;
      var sx = s.x - (px - W / 2) * par;
      var sy = s.y - (py - H / 2) * par;
      var tw = 0.55 + 0.45 * Math.sin(t * 2 + s.ph);
      ctx.fillStyle = 'hsla(' + s.hue + ',100%,' + (58 + s.z * 20) + '%,' + (s.a * tw) + ')';
      ctx.fillRect(sx, sy, s.r, s.r);
    }

    // dust motes (closest layer)
    ctx.save();
    for (var d = 0; d < dust.length; d++) {
      var m = dust[d];
      var dy = wrapNum(m.y + t * 14 * m.z, H + 40) - 20;
      var dx = wrapNum(m.x - t * 6 * m.z, W + 40) - 20;
      ctx.globalAlpha = 0.045 + m.z * 0.075;
      ctx.fillStyle = '#9ff8ff';
      ctx.beginPath();
      ctx.arc(dx, dy, 0.7 + m.z * 1.8, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // floor glow to separate the play plane from the void
    var hg = ctx.createLinearGradient(0, H * 0.58, 0, H);
    hg.addColorStop(0, 'rgba(34,211,238,0)');
    hg.addColorStop(1, od ? 'rgba(34,211,238,0.11)' : 'rgba(34,211,238,0.06)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, H * 0.58, W, H * 0.42);
  }

  function drawGrid() {
    var od = G.player && G.player.odActive > 0;
    var col = od ? '#7dfcff' : '#3b82f6';
    ctx.save();

    // far layer: fine, slow
    ctx.globalAlpha = 0.042;
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    var step1 = 54;
    var off1 = (G.time * 7) % step1;
    ctx.beginPath();
    for (var x = -step1 + off1; x < W + step1; x += step1) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (var y = -step1 + off1; y < H + step1; y += step1) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();

    // near layer: major, faster, brighter
    ctx.globalAlpha = 0.07;
    var step2 = 216;
    var off2 = (G.time * 18) % step2;
    ctx.beginPath();
    for (var x2 = -step2 + off2; x2 < W + step2; x2 += step2) { ctx.moveTo(x2, 0); ctx.lineTo(x2, H); }
    for (var y2 = -step2 + off2; y2 < H + step2; y2 += step2) { ctx.moveTo(0, y2); ctx.lineTo(W, y2); }
    ctx.stroke();

    // diagonal accent layer for an isometric read
    ctx.globalAlpha = 0.028;
    var step3 = 150;
    var off3 = (G.time * 24) % step3;
    ctx.beginPath();
    for (var x3 = -step3 + off3; x3 < W + H + step3; x3 += step3) {
      ctx.moveTo(x3, 0); ctx.lineTo(x3 - H, H);
    }
    ctx.stroke();

    ctx.restore();
  }

  function drawPlayer() {
    var p = G.player;
    if (!p) return;
    var i, g;

    // afterimages
    for (i = 0; i < G.ghosts.length; i++) {
      g = G.ghosts[i];
      ctx.save();
      ctx.translate(g.x, g.y); ctx.rotate(g.a);
      ctx.globalAlpha = (g.life / g.max) * 0.3;
      ctx.fillStyle = '#7dfcff';
      shipPath(ctx);
      ctx.fill();
      ctx.restore();
    }

    // contrail: points alternate port/starboard, one fading polyline per wing tip
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = PLAYER_LOOK.engine;
    ctx.lineWidth = 1.5;
    for (var side = 0; side < 2; side++) {
      for (i = side + 2; i < G.contrail.length; i += 2) {
        ctx.globalAlpha = clamp(G.contrail[i].life / 0.5, 0, 1) * 0.55;
        ctx.beginPath();
        ctx.moveTo(G.contrail[i - 2].x, G.contrail[i - 2].y);
        ctx.lineTo(G.contrail[i].x, G.contrail[i].y);
        ctx.stroke();
      }
    }
    ctx.restore();

    dropShadow(function () { shipPath(ctx); }, p.x, p.y, p.angle, 14);

    // twin engine plumes at the nozzles, behind the hull
    var thrust = 0.7 + p.thrust * 0.85 + Math.random() * 0.16;
    var nz = p.r * 0.17;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var n = -1; n <= 1; n += 2) {
      var ny = n * nz;
      var len = p.r * (1.35 + thrust);
      var fg = ctx.createLinearGradient(-p.r * 0.78, ny, -p.r * 0.78 - len, ny);
      fg.addColorStop(0, p.odActive > 0 ? 'rgba(235,255,255,0.95)' : withAlpha(PLAYER_LOOK.engine, 0.9));
      fg.addColorStop(0.28, p.odActive > 0 ? 'rgba(125,252,255,0.55)' : withAlpha(PLAYER_LOOK.engine, 0.5));
      fg.addColorStop(1, withAlpha(PLAYER_LOOK.engine, 0));
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(-p.r * 0.76, ny - p.r * 0.11);
      ctx.quadraticCurveTo(-p.r * 0.76 - len * 0.55, ny - p.r * 0.08, -p.r * 0.76 - len, ny);
      ctx.quadraticCurveTo(-p.r * 0.76 - len * 0.55, ny + p.r * 0.08, -p.r * 0.76, ny + p.r * 0.11);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.restore();

    // shield
    if (p.shield > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(96,165,250,' + (0.4 + 0.35 * Math.sin(G.time * 8)) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 10, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    // top face
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.scale(1, 1 - Math.abs(p.bank || 0) * 0.25);
    if (p.inv > 0 && p.dashT <= 0) ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(G.time * 22));

    // plating: bright silver, dark end lifted so the player is the brightest hull
    ctx.fillStyle = metalFill(p.r, PLAYER_LOOK.hull, p.bank, false, '#6b7a88');
    ctx.shadowColor = p.odActive > 0 ? '#7dfcff' : PLAYER_LOOK.engine;
    ctx.shadowBlur = 16;
    shipPath(ctx);
    ctx.fill();
    ctx.shadowBlur = 0;

    // panel seams
    ctx.strokeStyle = withAlpha(PLAYER_LOOK.trim, 0.8);
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(p.r * 0.62, 0); ctx.lineTo(-p.r * 0.62, 0);
    ctx.moveTo(p.r * 0.02, -p.r * 0.30); ctx.lineTo(-p.r * 0.36, -p.r * 0.92);
    ctx.moveTo(p.r * 0.02, p.r * 0.30); ctx.lineTo(-p.r * 0.36, p.r * 0.92);
    ctx.moveTo(-p.r * 0.30, -p.r * 0.44); ctx.lineTo(-p.r * 0.30, p.r * 0.44);
    ctx.stroke();

    // wing chevrons
    ctx.strokeStyle = withAlpha(PLAYER_LOOK.trim, 0.8);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-p.r * 0.08, -p.r * 0.46); ctx.lineTo(-p.r * 0.32, -p.r * 0.80);
    ctx.moveTo(-p.r * 0.08, p.r * 0.46); ctx.lineTo(-p.r * 0.32, p.r * 0.80);
    ctx.stroke();

    // canopy: glass gradient + specular streak
    var cg = ctx.createLinearGradient(p.r * 0.75, 0, -p.r * 0.05, 0);
    cg.addColorStop(0, '#f4ffff');
    cg.addColorStop(0.35, p.odActive > 0 ? '#bffcff' : '#8ef0ff');
    cg.addColorStop(1, '#0b4f63');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.ellipse(p.r * 0.42 - p.recoil * 2, 0, p.r * 0.33, p.r * 0.155, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(6,34,44,0.65)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.ellipse(p.r * 0.44 - p.recoil * 2, -p.r * 0.045, p.r * 0.24, p.r * 0.055, 0, Math.PI * 1.08, Math.PI * 1.62);
    ctx.stroke();

    // twin nozzles
    for (var nz2 = -1; nz2 <= 1; nz2 += 2) {
      ctx.fillStyle = '#0a2530';
      ctx.beginPath();
      ctx.arc(-p.r * 0.86, nz2 * p.r * 0.17, p.r * 0.13, 0, TAU);
      ctx.fill();
      ctx.fillStyle = p.odActive > 0 ? '#ffffff' : PLAYER_LOOK.engine;
      ctx.beginPath();
      ctx.arc(-p.r * 0.86, nz2 * p.r * 0.17, p.r * 0.062, 0, TAU);
      ctx.fill();
    }

    // nav lights: red port, green starboard
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#ff4d6d';
    ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(-p.r * 0.49, -p.r * 0.92, 1.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4dff9e';
    ctx.shadowColor = '#4dff9e';
    ctx.beginPath(); ctx.arc(-p.r * 0.49, p.r * 0.92, 1.2, 0, TAU); ctx.fill();
    ctx.restore();

    // lit top edge
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1;
    shipPath(ctx);
    ctx.stroke();

    ctx.restore();
  }

  // mirrored planform: half runs nose -> tail along y <= 0, then mirrors back
  function hullPath(c, half, r) {
    var i, n = half.length;
    c.beginPath();
    c.moveTo(half[0][0] * r, half[0][1] * r);
    for (i = 1; i < n; i++) c.lineTo(half[i][0] * r, half[i][1] * r);
    for (i = n - 2; i >= 1; i--) c.lineTo(half[i][0] * r, -half[i][1] * r);
    c.closePath();
  }

  // player interceptor: pointed nose, LERX, swept wings, tailplanes
  function shipPath(c) {
    hullPath(c, [
      [1.55, 0], [0.80, -0.20], [0.34, -0.26], [0.22, -0.60],
      [-0.38, -1.00], [-0.56, -0.96], [-0.48, -0.34], [-0.72, -0.42],
      [-0.94, -0.60], [-1.00, -0.52], [-0.86, -0.18], [-1.02, 0]
    ], 13.5);
  }

  // boss half-planforms (nose +x, y <= 0), one per BOSSES hull
  var BOSS_HULLS = {
    carrier: [[1.14, 0], [0.30, -0.34], [-0.42, -0.80], [-0.88, -0.84], [-0.76, -0.34], [-1.00, 0]],
    hydra: [[1.0, 0], [0.35, -0.12], [0.7, -0.55], [0.1, -0.42], [-0.3, -0.95], [-0.8, -0.7], [-0.7, -0.25], [-0.95, 0]],
    lance: [[1.45, 0], [0.4, -0.14], [0.25, -0.75], [-0.05, -0.8], [-0.35, -0.22], [-0.9, -0.3], [-0.85, 0]],
    wing: [[0.55, 0], [0.1, -0.35], [-0.45, -1.0], [-0.7, -0.95], [-0.55, -0.4], [-0.75, 0]]
  };
  // boss turret mounts [x, y, rad] in r units, mirrored across the axis
  var BOSS_TURRETS = {
    carrier: [[-0.05, 0.56, 0.075], [-0.48, 0.40, 0.065]],
    hydra: [[-0.1, 0.30, 0.06], [-0.3, 0.70, 0.07]],
